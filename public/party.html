<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Party · WordSpies</title>
<meta name="description" content="Drop into a WordSpies party — live audio with speakers, listeners, reactions and rationed chat.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#202124; --sub:#5f6368; --faint:#80868b; --line:#e8eaed;
  --bg:#ffffff; --panel:#f8f9fa; --hover:#f1f3f4;
  --accent:#5a7bff; --accent2:#7c5cff;
  --host:#f5b52e; --host-ink:#7a5b06;
  --green:#22c07a; --err:#d93025;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:840px;margin:0 auto;padding:0 20px calc(200px + env(safe-area-inset-bottom));min-height:100vh}

/* ══ Desktop pro layout (≥1000px) ══
   Two columns: left = speakers/listeners; right = chat rail. Fixed
   viewport height so the chat has its own scroll and the members panel
   doesn't fight for space. Chat composer is anchored at the bottom of
   its column instead of the whole viewport. */
@media(min-width:1000px){
  body{overflow:hidden;height:100vh}
  .wrap{max-width:1200px;padding:0 20px 0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr;grid-template-areas:'head head' 'main chat';gap:0 24px;height:100vh}
  .phead{grid-area:head}
  #pMain{grid-area:main;padding-bottom:0;overflow-y:auto;padding-right:6px}
  .pchat{position:relative;grid-area:chat;bottom:auto;left:auto;right:auto;border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:16px;display:flex;flex-direction:column;min-height:0}
  .pchat .pmsgs{max-height:none;flex:1;margin:0 0 8px;padding:8px 4px}
  .pchat .pcompose{padding-top:6px;border-top:1px solid var(--line);padding:12px 0 0}
  .pchat.hidden{display:none}
  /* Floating action pills stay pinned to the members column instead of
     centre-of-screen so they don't overlap the chat rail. */
  .micfab,.handfab{left:auto;right:calc(380px + 44px);transform:none;bottom:32px}
  .micfab:hover,.handfab:hover{transform:translateY(-1px)}
  .micfab:active,.handfab:active{transform:scale(.97)}
  /* Speakers get bigger avatars on wide screens — the party FEELS like
     a room instead of a mobile list. */
  .speakers{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .speakers .pav .circ{width:72px;height:72px;font-size:28px}
  .speakers .pav .nm{font-size:14px}
  .listeners{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .listeners .pav .circ{width:48px;height:48px;font-size:19px}
  /* Keyboard-shortcut hint under the mic pill */
  .kbdhint{grid-area:main;position:absolute;bottom:16px;left:26px;font-size:11px;font-weight:600;color:var(--faint);background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;pointer-events:none}
  .kbdhint kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--ink)}
}
@media(max-width:999px){ .kbdhint{display:none} }
.hidden{display:none !important}

/* Header — party title + subtitle, exit. Flat, no shadows. */
.phead{display:flex;align-items:center;gap:12px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.pback{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:50%;width:38px;height:38px;font-size:17px;cursor:pointer;flex-shrink:0;transition:background .12s}
.pback:hover{background:var(--hover)}
.pinfo{flex:1;min-width:0}
.ptitle{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:20px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.psub{color:var(--sub);font-size:13px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;gap:6px;flex-shrink:0}
.pchip{background:var(--panel);color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px}
.pchip.live{background:#fff5f5;border-color:#f8d3d3;color:#d93025}
.pchip.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#d93025;display:inline-block;animation:plive 1.4s ease-in-out infinite}
@keyframes plive{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* Section headers */
.psect{margin-bottom:26px}
.psect .ph{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.psect .ph h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.1px}
.psect .ph h3 b{color:var(--faint);font-weight:600;font-size:13px;margin-left:6px}
.psect .ph .phelp{font-size:11.5px;color:var(--faint);font-weight:600}

/* Speaker + listener grids */
.speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.listeners{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}

/* Avatar tile — clean, borderless. Optional coloured ring for host / live. */
.pav{position:relative;text-align:center;padding:8px 2px;border-radius:14px;transition:background .12s;cursor:default}
.pav.tapMe{cursor:pointer}
.pav.tapMe:active{background:var(--hover)}
.pav .circ{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;background:#5a7bff;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:24px;overflow:hidden;position:relative}
.pav .circ img{width:100%;height:100%;object-fit:cover;display:block}
/* Host: gold ring, gold accent — very clear who runs the room. */
.pav.host .circ{outline:3px solid var(--host);outline-offset:2px;background:linear-gradient(135deg,#f5b52e,#e07200)}
/* Speaker ring is blue */
.pav.speaker .circ{outline:2px solid var(--accent);outline-offset:2px}
/* Live-mic pulse */
.pav.live .circ::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:plive 1.2s ease-out infinite}
.pav.live .circ{outline-color:var(--green)}
/* Muted overlay (someone connected but mic off) */
.pav .micchip{position:absolute;bottom:32px;right:calc(50% - 32px);background:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid var(--line)}
.pav .micchip.on{background:var(--green);color:#fff;border-color:var(--green)}
.pav .micchip.off{color:var(--faint)}
/* Little tap-to-talk hint over my own avatar */
.pav.tapMe .circ::before{content:'Tap to talk';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.pav.tapMe:hover .circ::before{opacity:.9}
.pav.tapMe.live .circ::before{content:'Tap to mute';background:var(--green)}
.pav .nm{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pav .rl{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:1px}
.pav .rl.host{color:var(--host-ink)}

.listeners .pav{padding:6px 2px}
.listeners .pav .circ{width:44px;height:44px;font-size:17px;margin-bottom:6px}
.listeners .pav .nm{font-size:11px}
.listeners .pav .rl{display:none}
.listeners .pav .micchip{display:none}
/* Listener with hand raised */
.pav.hand::before{content:'✋';position:absolute;top:0;right:6px;font-size:14px;background:#fff8e6;padding:3px 5px;border-radius:99px;border:1px solid #f0d97a;animation:handwave 1.3s ease-in-out infinite}
@keyframes handwave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

/* Contextual actions row — appears below a speaker/listener when host taps */
.pav.selected{background:var(--hover)}
.pav-menu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:none;flex-direction:column;gap:2px;z-index:10;min-width:130px}
.pav.selected .pav-menu{display:flex}
.pav-menu button{background:transparent;color:var(--ink);border:0;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:6px;text-align:left;cursor:pointer;white-space:nowrap}
.pav-menu button:hover{background:var(--hover)}
.pav-menu button.danger{color:var(--err)}

/* Raise-hand queue for hosts */
.hostqueue{background:#fff8e6;border:1px solid #f0d97a;border-radius:14px;padding:12px 14px;margin-bottom:22px}
.hostqueue .hqhdr{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--host-ink);margin-bottom:10px}
.hostqueue .hqrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0d97a}
.hostqueue .hqrow:first-of-type{border-top:0}
.hostqueue .hqav{width:32px;height:32px;border-radius:50%;background:#f5b52e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.hostqueue .hqav img{width:100%;height:100%;object-fit:cover}
.hostqueue .hqnm{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
.hostqueue .hqbtns{display:flex;gap:6px;flex-shrink:0}
.hostqueue .hqbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:12px;cursor:pointer}
.hostqueue .hqbtn.deny{background:#fff;color:var(--sub);border:1px solid var(--line)}

/* Floating action pills above the chat panel — always visible, impossible
   to miss. Two variants: mic (speakers), raise-hand (listeners). Only
   ONE ever shows at a time based on the user's role. */
.micfab,.handfab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:10px;border:0;border-radius:99px;padding:12px 22px 12px 16px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:transform .1s,background .12s,box-shadow .12s;color:#fff}
.micfab.show,.handfab.show{display:inline-flex}
.micfab{background:var(--ink)}
.micfab .mfico{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.micfab.on{background:var(--green);animation:plive 1.4s ease-in-out infinite}
.micfab.on .mfico{background:rgba(255,255,255,.22)}
.micfab:hover,.handfab:hover{transform:translateX(-50%) translateY(-1px)}
.micfab:active,.handfab:active{transform:translateX(-50%) scale(.97)}
/* Raise-hand: red pill so it screams "ask to speak" — owner's ask. */
.handfab{background:#d93025;box-shadow:0 6px 18px rgba(217,48,37,.32)}
.handfab.up{background:#a52618;box-shadow:0 6px 18px rgba(165,38,24,.4)}
.handfab .hfico{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
@media(max-width:480px){
  .micfab,.handfab{bottom:calc(150px + env(safe-area-inset-bottom));padding:10px 18px 10px 12px;font-size:14px}
  .micfab .mfico,.handfab .hfico{width:28px;height:28px;font-size:14px}
}

/* Bottom chat panel — flat, white, no drop-shadow. Border-top only. */
.pchat{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
.pmsgs{max-width:640px;margin:0 auto 6px;max-height:180px;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:5px}
.pmsg{background:var(--panel);border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.4;word-break:break-word;color:var(--ink)}
.pmsg .pmwho{font-weight:800;font-size:11px;color:var(--accent);margin-right:6px}
.pmsg .pmwho.host{color:var(--host-ink)}
.pmsg.mine{background:#e8f0fe;color:#1a3a8a;align-self:flex-end;max-width:80%}

.pcompose{max-width:640px;margin:0 auto;display:flex;gap:6px;align-items:center}
.pcompose .pinput{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:14.5px;padding:10px 14px;border-radius:99px;outline:none;min-width:0;transition:border-color .12s,background .12s}
.pcompose .pinput:focus{border-color:var(--accent);background:#fff}
.pcompose .pinput:disabled{opacity:.55}
.pcompose .pbtn{background:var(--accent);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s}
.pcompose .pbtn:hover{background:#4a68e0}
.pcompose .pbtn:disabled{opacity:.45;cursor:default}
.pcompose .pemo{background:var(--panel);color:var(--ink);border:1px solid var(--line);width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0}
.pcompose .pemo:hover{background:var(--hover)}
/* raise-hand button that replaces the mic slot for listeners */
.pcompose .praise{display:none}   /* replaced by the big FAB below */
.pquota{max-width:640px;margin:0 auto 5px;text-align:center;font-size:11.5px;color:var(--sub);font-weight:600}
.pquota .pq-strong{color:var(--ink)}
.pquota .pq-none{color:var(--err)}

/* Emoji burst dock */
.pemoji-pick{max-width:640px;margin:0 auto 6px;display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;gap:2px}
.pemoji-pick.show{display:flex;flex-wrap:wrap;justify-content:center}
.pemoji-pick button{background:transparent;color:var(--ink);border:0;font-size:22px;padding:6px 10px;border-radius:8px;cursor:pointer}
.pemoji-pick button:hover{background:var(--hover)}

/* Header action buttons */
.pleave{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:8px;transition:background .12s}
.pleave:hover{background:var(--hover);color:var(--ink)}
.pend{background:#fff5f5;color:var(--err);border:1px solid #f8d3d3;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:6px;transition:background .12s}
.pend:hover{background:#ffe4e4}

/* Toasts */
.ptoast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;pointer-events:none;opacity:0;transition:.2s}
.ptoast.show{opacity:1;top:24px}
</style>
</head>
<body>

<div class="wrap">
  <div class="phead">
    <button class="pback" onclick="leaveAndGo()" title="Leave the party">←</button>
    <div class="pinfo">
      <div class="ptitle" id="pTitle">Loading…</div>
      <div class="psub" id="pSub"></div>
    </div>
    <div class="pmeta">
      <span class="pchip live" id="pLive">LIVE</span>
    </div>
    <!-- Two actions in the header: everyone gets Leave; only the host gets
         End party. Placed together so the flow is obvious. -->
    <button class="pleave" id="pLeaveBtn" onclick="leaveAndGo()">Leave</button>
    <button class="pend hidden" id="pEndBtn" onclick="endParty()">End party</button>
  </div>

  <!-- Raise-hand queue — only rendered for hosts. -->
  <div class="hostqueue hidden" id="pQueue"></div>

  <div class="psect">
    <div class="ph"><h3>🎙 Speakers <b id="speakerCnt">0</b></h3><span class="phelp">Tap your avatar to talk</span></div>
    <div class="speakers" id="speakers"></div>
  </div>
  <div class="psect">
    <div class="ph"><h3>👂 Listeners <b id="listenerCnt">0</b></h3></div>
    <div class="listeners" id="listeners"></div>
  </div>
</div>

<!-- Big always-visible action pills above the chat bar. Only one shows
     at a time depending on my role. -->
<button class="micfab" id="pMicFab" onclick="toggleMyMic()">
  <span class="mfico">🎤</span>
  <span id="pMicFabLbl">Tap to talk</span>
</button>
<button class="handfab" id="pHandFab" onclick="toggleHand()">
  <span class="hfico">✋</span>
  <span id="pHandFabLbl">Raise hand to speak</span>
</button>

<!-- Keyboard shortcut hint (desktop only) -->
<div class="kbdhint" id="kbdHint"><kbd>Space</kbd> hold to talk · <kbd>Esc</kbd> minimise</div>

<!-- Fixed chat panel at the bottom -->
<div class="pchat hidden" id="pChat">
  <div class="pquota" id="pQuota"></div>
  <div class="pmsgs" id="pMsgs"></div>
  <div class="pemoji-pick" id="pEmojiPick">
    <button data-e="❤️">❤️</button><button data-e="😂">😂</button><button data-e="🔥">🔥</button>
    <button data-e="👏">👏</button><button data-e="😮">😮</button><button data-e="🎉">🎉</button>
    <button data-e="💯">💯</button><button data-e="🙌">🙌</button>
  </div>
  <div class="pcompose">
    <!-- Listeners see a raise-hand pill here; speakers see nothing (mic is
         on their avatar now). Slot stays reserved so layout doesn't jump. -->
    <button class="praise hidden" id="pRaiseBtn" onclick="toggleHand()" title="Ask to speak">✋</button>
    <input class="pinput" id="pInput" placeholder="Say something…" maxlength="500" autocomplete="off">
    <button class="pemo" onclick="document.getElementById('pEmojiPick').classList.toggle('show')" title="React">🎉</button>
    <button class="pbtn" id="pSendBtn" title="Send">➤</button>
  </div>
</div>

<div class="ptoast" id="pToast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/voice.js"></script>
<script src="/emoji-fly.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
let CODE = (params.get('room') || '').trim().toUpperCase();
const EMBED = params.get('embed') === '1';   // true when hosted inside /social's iframe
let socket = null, room = null, myId = null, myRole = 'listener', msgsLeft = 2, myHandUp = false, selectedMemberId = null;
let ME_UID = null;   // set from the 'joined' event; used by the host-reclaim fallback

// Talk to the parent /social if we're embedded — used to close the host
// iframe when the party ends, minimize on user gesture, etc.
function postToParent(msg){
  if (!EMBED) return;
  try { parent.postMessage(msg, location.origin); } catch(e){}
}
if (EMBED) {
  // Hide the standalone back button — the parent owns navigation now.
  document.addEventListener('DOMContentLoaded', () => {
    const back = document.querySelector('.pback'); if (back) back.style.display = 'none';
    // Parent listens for a leave request from inside.
    window.addEventListener('message', (ev) => {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.type === 'party:leave') leaveAndGo();
    });
  });
}

// Boot: load room + open socket + auto-join. There's no separate "Join" tap
// any more — the whole point of opening /party?room=... IS to join, so we
// do that immediately.
async function boot(){
  if (!CODE) { alert('No party code in the URL.'); location.href = '/social'; return; }
  try {
    const r = await fetch('/api/parties/' + encodeURIComponent(CODE));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Party not found.');
    room = j.room;
    $('pTitle').textContent = room.title;
    $('pSub').textContent = room.subtitle || '';
  } catch(e){ alert(e.message); location.href = '/social'; return; }
  // Open the socket + auto-join.
  conn().emit('join', { code: CODE });
}

function conn(){
  if (socket) return socket;
  socket = io('/party');
  socket.on('state', st => { room = st; paint(); });
  socket.on('joined', d => {
    myId = d.you; myRole = d.role; msgsLeft = d.msgsLeft || 0;
    ME_UID = d.uid || null;
    $('pChat').classList.remove('hidden');
    if (myRole === 'host') $('pEndBtn').classList.remove('hidden');
    paintQuota();
    paintRaiseBtn();
    // Voice — publisher if host/speaker, listener otherwise. Voice module
    // handles CF SFU vs P2P internally.
    if (window.wsVoice) {
      wsVoice.setMyId(myId);
      wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
      wsVoice.init({ socket, myId, canPublish: (myRole === 'host' || myRole === 'speaker') });
      wsVoice.on('mic', () => paint());       // avatar ring reflects mic state
    }
    if (window.wsEmojiFly) wsEmojiFly.init({ socket });
    // Defensive: if the server seated me as a non-host but the room
    // was actually created by me, ask it to reclaim host. Server verifies
    // the uid so this can't be spoofed by anyone else. Slight delay so
    // the first state broadcast has time to arrive with room.hostUid.
    setTimeout(() => {
      if (!room) return;
      if (myRole !== 'host' && room.hostUid && ME_UID && room.hostUid === ME_UID) {
        socket.emit('reclaimHost');
      }
    }, 800);
  });
  socket.on('chat', addMsg);
  socket.on('chatMeta', m => { msgsLeft = m.msgsLeft; paintQuota(); });
  socket.on('chatBlocked', d => toast(d.reason || 'Chat blocked'));
  socket.on('replaced', () => toast('You joined from another tab — this one\'s inactive.'));
  socket.on('kicked', () => {
    clearPartySession(); toast('The host removed you from the party.');
    postToParent({ type: 'party:kicked' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  socket.on('closed', () => {
    clearPartySession(); toast('The host ended this party.');
    postToParent({ type: 'party:closed' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  socket.on('err', e => toast(e.msg || 'Something went wrong.'));
  return socket;
}
boot();

// Chat send — respects the 2-message listener limit
function send(){
  const v = $('pInput').value.trim();
  if (!v || !socket) return;
  if (myRole === 'listener' && msgsLeft <= 0) { toast('Only 2 messages for listeners — wait for the host to promote you.'); return; }
  socket.emit('chat', { text: v });
  $('pInput').value = '';
}
$('pSendBtn').onclick = send;
$('pInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Emoji picker → floating burst
document.getElementById('pEmojiPick').querySelectorAll('button[data-e]').forEach(b => {
  b.onclick = () => { if (window.wsEmojiFly) wsEmojiFly.send(b.dataset.e); document.getElementById('pEmojiPick').classList.remove('show'); };
});

// Raise-hand for listeners.
function toggleHand(){
  if (!socket || myRole !== 'listener') return;
  myHandUp = !myHandUp;
  socket.emit(myHandUp ? 'raiseHand' : 'lowerHand');
  paintRaiseBtn();
}
function paintRaiseBtn(){
  const btn = $('pRaiseBtn');
  if (btn) btn.classList.add('hidden');   // legacy composer pill retired
  const fab = $('pHandFab');
  const lbl = $('pHandFabLbl');
  if (!fab || !lbl) return;
  if (myRole === 'listener') {
    fab.classList.add('show');
    fab.classList.toggle('up', myHandUp);
    lbl.textContent = myHandUp ? 'Hand raised — waiting for host' : 'Raise hand to speak';
  } else {
    fab.classList.remove('show');
  }
}

// Keyboard shortcuts (desktop pro): hold Space to talk (push-to-talk),
// tap Esc to minimise back into the community app. Ignored while the
// chat input has focus so typing "hello world" doesn't blast the mic.
let pttHeld = false;
document.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'Escape') {
    e.preventDefault();
    postToParent({ type: 'party:minimize' });
    return;
  }
  if (e.code === 'Space' && !e.repeat) {
    if (!(myRole === 'host' || myRole === 'speaker')) return;
    e.preventDefault();
    // First press of a fresh chain — treat as PTT-on if mic was off.
    if (!window.wsVoice) return;
    if (!wsVoice.micOn) { pttHeld = true; toggleMyMic(); }
    else { pttHeld = false; }   // if mic already on (toggle mode) leave it alone
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && pttHeld) {
    pttHeld = false;
    if (window.wsVoice && wsVoice.micOn) toggleMyMic();
  }
});

async function toggleMyMic(){
  if (!window.wsVoice) return;
  if (!(myRole === 'host' || myRole === 'speaker')) {
    toast('You\'re a listener — tap ✋ to ask the host to raise you.');
    return;
  }
  try {
    await wsVoice.setMic(!wsVoice.micOn);
    paint();
  } catch(e){ toast(e.message || 'Microphone failed.'); }
}

function paint(){
  if (!room) return;
  $('pTitle').textContent = room.title;
  $('pSub').textContent = room.subtitle || '';
  // Refresh the community-app rejoin bridge each state tick.
  markPartySession();
  // Keep the iframe host's title synced with the party's live title.
  postToParent({ type: 'party:title', title: room.title });
  const iAmHost = myRole === 'host';
  const iAmSpeaker = iAmHost || myRole === 'speaker';
  const micOn = window.wsVoice && wsVoice.micOn;

  // Big always-visible mic pill: shown to hosts and speakers only, label
  // + colour reflect whether the mic is live.
  const fab = $('pMicFab'), fabLbl = $('pMicFabLbl');
  if (fab && fabLbl) {
    fab.classList.toggle('show', iAmSpeaker);
    fab.classList.toggle('on', !!micOn);
    fabLbl.textContent = micOn ? 'You\'re live — tap to mute' : 'Tap to talk';
  }

  const speakers = room.members.filter(m => m.role === 'host' || m.role === 'speaker');
  const listeners = room.members.filter(m => m.role === 'listener');
  $('speakerCnt').textContent = speakers.length;
  $('listenerCnt').textContent = listeners.length;
  $('speakers').innerHTML = speakers.map(m => memberCard(m, true, iAmHost, micOn)).join('');
  $('listeners').innerHTML = listeners.map(m => memberCard(m, false, iAmHost, micOn)).join('');

  // Message rail — cheap re-render if the count changed.
  if (room.messages && $('pMsgs').childElementCount !== room.messages.length) {
    $('pMsgs').innerHTML = '';
    room.messages.forEach(addMsg);
  }

  // Detect role change (promoted / demoted) and react.
  const me = room.members.find(m => m.id === myId);
  if (me && me.role !== myRole) {
    const wasListener = myRole === 'listener';
    myRole = me.role;
    if (window.wsVoice) wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
    if (myRole === 'host') { msgsLeft = 999; toast('You\'re now a co-host! Full mic + unlimited chat.'); myHandUp = false; }
    else if (myRole === 'speaker') { msgsLeft = 999; toast('You\'re a speaker! Tap your avatar to talk.'); myHandUp = false; }
    else if (wasListener === false) { toast('You\'re a listener now.'); }
    if (iAmHost && !$('pEndBtn').classList.contains('hidden') && myRole !== 'host') $('pEndBtn').classList.add('hidden');
    if (myRole === 'host') $('pEndBtn').classList.remove('hidden');
    paintQuota();
    paintRaiseBtn();
  }

  // Reflect my hand state from server so it survives refresh.
  if (me) myHandUp = !!me.handRaised;
  paintRaiseBtn();

  // Host queue — anyone with hand raised, sorted by when they raised.
  if (iAmHost) {
    const hands = room.members.filter(m => m.handRaised && m.role === 'listener')
      .sort((a, b) => (a.handAt || 0) - (b.handAt || 0));
    const q = $('pQueue');
    if (hands.length) {
      q.classList.remove('hidden');
      q.innerHTML = '<div class="hqhdr">✋ ' + hands.length + ' asking to speak</div>' +
        hands.map(h => {
          const av = h.photo ? '<img src="' + esc(h.photo) + '" alt="">' : esc((h.name || '?').charAt(0).toUpperCase());
          return '<div class="hqrow"><span class="hqav">' + av + '</span>' +
            '<span class="hqnm">' + esc(h.name) + '</span>' +
            '<div class="hqbtns">' +
              '<button class="hqbtn" onclick="promoteMember(\'' + esc(h.id) + '\', \'speaker\')">Approve</button>' +
              '<button class="hqbtn deny" onclick="denyHand(\'' + esc(h.id) + '\')">Not now</button>' +
            '</div></div>';
        }).join('');
    } else q.classList.add('hidden');
  } else {
    $('pQueue').classList.add('hidden');
  }
}
function memberCard(m, isSpeakerPanel, iAmHost, myMicOn){
  const isMe = m.id === myId;
  const isHost = m.role === 'host';
  const cls = ['pav'];
  if (isHost) cls.push('host');
  else if (m.role === 'speaker') cls.push('speaker');
  if (isMe) cls.push('me');
  if (isMe && myMicOn) cls.push('live');
  if (isMe && (isHost || m.role === 'speaker')) cls.push('tapMe');
  if (iAmHost && !isMe && !(isHost && m.uid === room.hostUid)) cls.push('canManage');
  if (selectedMemberId === m.id && iAmHost) cls.push('selected');
  if (m.handRaised && !isSpeakerPanel) cls.push('hand');

  const av = m.photo
    ? '<img src="' + esc(m.photo) + '" alt="">'
    : esc((m.name || '?').charAt(0).toUpperCase());
  const roleLbl = isHost ? (isMe ? 'You · Host' : 'Host')
    : m.role === 'speaker' ? (isMe ? 'You · Speaker' : 'Speaker')
    : (isMe ? 'You' : 'Listener');
  const roleCls = isHost ? ' host' : '';
  const micChip = isSpeakerPanel && isMe ? `<span class="micchip ${myMicOn ? 'on' : 'off'}">${myMicOn ? '🎤' : '🔇'}</span>` : '';
  const hostMenu = iAmHost && !isMe && !(isHost && m.uid === room.hostUid) ? `
    <div class="pav-menu">
      ${m.role === 'listener' ? `<button onclick="promoteMember('${esc(m.id)}','speaker')">🎙 Make speaker</button>` : ''}
      ${m.role !== 'host'     ? `<button onclick="promoteMember('${esc(m.id)}','host')">👑 Make co-host</button>` : ''}
      ${m.role !== 'listener' ? `<button onclick="demoteMember('${esc(m.id)}')">↓ Move to listeners</button>` : ''}
      <button class="danger" onclick="kickMember('${esc(m.id)}')">Remove from party</button>
    </div>` : '';

  const onclick = isMe && (isHost || m.role === 'speaker')
    ? 'onclick="toggleMyMic()"'
    : (iAmHost && !isMe && !(isHost && m.uid === room.hostUid))
    ? `onclick="event.stopPropagation();selectMember('${esc(m.id)}')"`
    : '';

  return `<div class="${cls.join(' ')}" ${onclick}>
    <div class="circ">${av}</div>
    ${micChip}
    <div class="nm">${esc(m.name)}</div>
    ${isSpeakerPanel ? `<div class="rl${roleCls}">${roleLbl}</div>` : ''}
    ${hostMenu}
  </div>`;
}

function selectMember(id){ selectedMemberId = selectedMemberId === id ? null : id; paint(); }
document.addEventListener('click', ev => {
  // Click outside any .pav-menu clears selection.
  if (!ev.target.closest('.pav')) { selectedMemberId = null; paint(); }
});

function paintQuota(){
  const q = $('pQuota');
  const inp = $('pInput');
  if (myRole === 'host' || myRole === 'speaker') {
    q.innerHTML = '<span class="pq-strong">Unlimited chat</span> · you\'re a speaker';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else if (msgsLeft > 0) {
    q.innerHTML = 'Listener chat · <span class="pq-strong">' + msgsLeft + ' message' + (msgsLeft === 1 ? '' : 's') + ' left</span>';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else {
    q.innerHTML = '<span class="pq-none">You\'ve used both your messages.</span> Tap ✋ to ask to speak — reactions still work.';
    inp.disabled = true;
    inp.placeholder = 'Chat limit reached';
  }
}
function addMsg(m){
  const el = document.createElement('div');
  el.className = 'pmsg' + (m.f === myId ? ' mine' : '');
  const roleCls = m.r === 'host' ? ' host' : '';
  el.innerHTML = '<span class="pmwho' + roleCls + '">' + esc(m.n) + '</span>' + esc(m.x);
  $('pMsgs').appendChild(el);
  $('pMsgs').scrollTop = $('pMsgs').scrollHeight;
}

// Host actions
function promoteMember(id, role){ socket && socket.emit('promote', { id, role }); selectedMemberId = null; }
function demoteMember(id){ socket && socket.emit('demote', { id }); selectedMemberId = null; }
function kickMember(id){ if (confirm('Remove this person from the party?')) socket && socket.emit('kick', { id }); selectedMemberId = null; }
function denyHand(id){
  // Tell the server to clear their raised-hand flag; broadcast repaints
  // everyone. Local flag-toggle here is optimistic so the queue clears
  // instantly even before the state event round-trips.
  if (socket) socket.emit('denyHand', { id });
  const m = room.members.find(x => x.id === id); if (m) m.handRaised = false;
  paint();
}
function endParty(){ if (confirm('End the party for everyone?')) socket && socket.emit('closeParty'); }

function leaveAndGo(){
  try { socket && socket.emit('leave'); } catch(e){}
  clearPartySession();
  if (EMBED) { postToParent({ type: 'party:left' }); return; }
  location.href = '/social';
}

// Session bridge for the community app's mini-bar. Whenever we're in a
// party we write to localStorage; when the user opens /social they see
// a persistent "🎤 In party — tap to rejoin" bar. Cleared on leave/close.
function markPartySession(){
  try {
    localStorage.setItem('wsActiveParty', JSON.stringify({
      code: CODE,
      title: (room && room.title) || 'Party',
      role: myRole,
      at: Date.now()
    }));
  } catch(e){}
}
function clearPartySession(){ try { localStorage.removeItem('wsActiveParty'); } catch(e){} }

// beforeunload: warn if the user tries to close the tab / navigate away
// while in a party. Skipped when we're an embed — the parent /social
// document owns the unload dialog and we don't want two prompts.
window.addEventListener('beforeunload', (ev) => {
  if (EMBED) return;
  if (!socket || !myId) return;
  ev.preventDefault(); ev.returnValue = ''; return '';
});

let toastT = null;
function toast(msg){
  const el = $('pToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
<script src="/wsbrand.js" defer></script>
