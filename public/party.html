<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Party · TalkSibi</title>
<meta name="description" content="Drop into a TalkSibi party — live audio with speakers, listeners, reactions and rationed chat.">
<meta name="theme-color" content="#16181f">
<link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="mask-icon" href="/favicon.svg" color="#5b6cff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<!-- 1c reskin: Hanken Grotesk per talksibi rebrand tokens (README §12). -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#202124; --sub:#5f6368; --faint:#80868b; --line:#e8eaed;
  --bg:#ffffff; --panel:#f8f9fa; --hover:#f1f3f4;
  --accent:#5a7bff; --accent2:#7c5cff;
  --host:#f5b52e; --host-ink:#7a5b06;
  --green:#22c07a; --err:#d93025;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 0;height:100dvh;display:flex;flex-direction:column}
/* Mobile: the members area scrolls INTERNALLY. Page itself never
   scrolls — the chat panel + FABs stay pinned. */
#pMain{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 calc(200px + env(safe-area-inset-bottom))}

/* ══ Desktop pro layout (≥1000px) ══
   Two columns: left = speakers/listeners; right = chat rail. Fixed
   viewport height so the chat has its own scroll and the members panel
   doesn't fight for space. Chat composer is anchored at the bottom of
   its column instead of the whole viewport. */
@media(min-width:1000px){
  body{overflow:hidden;height:100vh}
  .wrap{max-width:1200px;padding:0 20px 0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr;grid-template-areas:'head head' 'main chat';gap:0 24px;height:100vh}
  .phead{grid-area:head}
  #pMain{grid-area:main;padding-bottom:0;overflow-y:auto;padding-right:6px}
  .pchat{position:relative;grid-area:chat;bottom:auto;left:auto;right:auto;border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:16px;display:flex;flex-direction:column;min-height:0}
  .pchat .pmsgs{max-height:none;flex:1;margin:0 0 8px;padding:8px 4px}
  .pchat .pcompose{padding-top:6px;border-top:1px solid var(--line);padding:12px 0 0}
  .pchat.hidden{display:none}
  /* Floating action pills stay pinned to the members column instead of
     centre-of-screen so they don't overlap the chat rail. */
  .micfab,.handfab{left:auto;right:calc(380px + 44px);transform:none;bottom:32px}
  .micfab:hover,.handfab:hover{transform:translateY(-1px)}
  .micfab:active,.handfab:active{transform:scale(.97)}
  /* Speakers get bigger avatars on wide screens — the party FEELS like
     a room instead of a mobile list. */
  .speakers{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .speakers .pav .circ{width:72px;height:72px;font-size:28px}
  .speakers .pav .nm{font-size:14px}
  .listeners{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .listeners .pav .circ{width:48px;height:48px;font-size:19px}
  /* Keyboard-shortcut hint under the mic pill */
  .kbdhint{grid-area:main;position:absolute;bottom:16px;left:26px;font-size:11px;font-weight:600;color:var(--faint);background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;pointer-events:none}
  .kbdhint kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--ink)}
}
@media(max-width:999px){ .kbdhint{display:none} }
.hidden{display:none !important}

/* Party header — title + subtitle on the left, End (host only) right. */
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 4px 8px;flex-shrink:0}
.phead-txt{min-width:0;flex:1}
.phead-txt h1{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:19px;color:var(--ink);letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead-txt p{font-size:12.5px;color:var(--faint);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Language flag+name pills (owner ask 14 Aug 2026 — mirror the party
   card in the Community strip). Small muted chips under the subtitle. */
.phead-langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.phead-langs.hidden{display:none}
.phead-langs .plchip{display:inline-flex;align-items:center;gap:5px;background:#f4f5f7;color:var(--sub);border-radius:99px;padding:3px 9px 3px 6px;font-size:12px;font-weight:600;line-height:1;letter-spacing:-.1px}
.phead-langs .plchip .fl{font-size:15px;line-height:1}
.phead-btns{display:flex;gap:8px;flex-shrink:0}
/* Leave button is the ESCAPE HATCH from the party — the way back to
   Community. Owner reported (1 Aug 2026) the white/grey styling was
   almost invisible against the white party page: 'the tab you make it
   is white color it is confusing… people can easily move from the party
   to the other tabs'. Now high-contrast dark pill with a back arrow so
   it reads unambiguously as 'exit'. */
.pheadLeave{background:var(--ink,#202124);color:#fff;border:0;border-radius:99px;padding:9px 16px 9px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;font-size:13.5px;cursor:pointer;transition:background .12s,transform .1s;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(20,23,42,.18)}
.pheadLeave:hover{background:#000}
.pheadLeave:active{transform:scale(.95)}
.pheadLeave::before{content:'←';font-size:16px;line-height:1;font-weight:700}
.pheadEnd{background:#fff5f5;color:var(--err);border:1px solid #f8d3d3;border-radius:99px;padding:8px 14px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:background .12s,transform .1s}
.pheadEnd:hover{background:#ffe4e4}
.pheadEnd:active{transform:scale(.95)}
/* Reconnect audio button — user escape hatch when they can't hear or be heard */
.pheadRec{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:99px;padding:8px 14px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:12.5px;cursor:pointer;transition:background .12s,transform .1s,border-color .12s;white-space:nowrap}
.pheadRec:hover{background:#dbeafe;border-color:#93c5fd}
.pheadRec:active{transform:scale(.95)}
.pheadRec.spinning{opacity:.6;pointer-events:none}
.pheadRec.spinning::before{display:inline-block;animation:spinRot 1s linear infinite}
@keyframes spinRot{to{transform:rotate(360deg)}}

/* Centred emoji picker — floats over everything, backdrop dims. */
.emopop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(20,22,28,.45);animation:emofade .15s ease-out}
.emopop.show{display:flex}
.emopop .emopop-card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:min(320px,90vw)}

/* Invite modal — reuses the .emopop backdrop, own card layout. */
.invpop .invcard{background:#fff;border-radius:22px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(400px,92vw);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.invstep{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
.invstep.hidden{display:none}
.invstep h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:19px;color:var(--ink);margin-bottom:6px}
.invopt{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-family:inherit;text-align:left;cursor:pointer;transition:background .12s,transform .1s}
.invopt:hover{background:var(--hover)}
.invopt:active{transform:scale(.98)}
.invopt .invopt-ic{width:44px;height:44px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:1px solid var(--line)}
.invopt b{display:block;font-weight:700;font-size:14.5px;color:var(--ink);margin-bottom:2px}
.invopt span{font-size:12px;color:var(--faint);font-weight:600}
.invclose,.invback{background:transparent;border:0;color:var(--sub);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;padding:8px}
.invclose{align-self:center;margin-top:4px}
.invtop{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.invtop h3{margin-bottom:0}
.invback{padding:6px 8px;border-radius:8px}
.invback:hover{background:var(--hover);color:var(--ink)}
.invlist{flex:1;min-height:120px;max-height:50vh;overflow-y:auto;margin:4px -6px;padding:0 6px}
.invempty{padding:22px 0;text-align:center;font-size:13px;color:var(--faint);font-weight:600}
.invrow{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .12s}
.invrow:hover{background:var(--hover)}
.invrow.on{background:#eef1ff}
.invrow .invav{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#5a7bff,#7c5cff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0}
.invrow .invav img{width:100%;height:100%;object-fit:cover}
.invrow .invmeta{flex:1;min-width:0}
.invrow .invnm{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.invrow .invrl{font-size:11.5px;color:var(--faint);font-weight:600}
.invrow.online .invnm::after{content:'';display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-left:6px;vertical-align:middle}
.invrow .invchk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s,border-color .12s;color:#fff;font-size:12px}
.invrow.on .invchk{background:var(--accent);border-color:var(--accent)}
.invsend{background:var(--accent);color:#fff;border:0;border-radius:99px;padding:12px;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer;margin-top:6px;transition:background .12s,opacity .12s}
.invsend:hover:not(:disabled){background:#4a68e0}
.invsend:disabled{opacity:.45;cursor:default}
.emopop .emopop-card button{background:transparent;border:0;font-size:32px;padding:12px 6px;border-radius:14px;cursor:pointer;line-height:1;transition:background .12s,transform .06s}
.emopop .emopop-card button:hover{background:var(--hover)}
.emopop .emopop-card button:active{transform:scale(.9)}
@keyframes emofade{from{opacity:0}to{opacity:1}}

/* Emoji burst — small, sits inside the profile circle. One at a time
   per member; a new emoji replaces the old. */
/* Emoji bursts live longer now — owner reported 2026-08-01 they
   'disappear too fast'. Bumped animation from 1.1s to 4s: quick pop-in,
   long plateau at full opacity so remote viewers actually catch it,
   then a gentle fade at the end. JS TTL in reapplyEmojis() is aligned
   to match. */
.pav .pav-emo{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:26px;pointer-events:none;animation:pavEmoPop 4s cubic-bezier(.34,1.56,.64,1) forwards;z-index:9;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
@keyframes pavEmoPop{
  0%{transform:translateX(-50%) scale(.2);opacity:0}
  8%{transform:translateX(-50%) scale(1.3);opacity:1}
  15%{transform:translateX(-50%) scale(1);opacity:1}
  85%{transform:translateX(-50%) scale(1);opacity:1}
  100%{transform:translateX(-50%) scale(.85);opacity:0}
}
.listeners .pav .pav-emo{font-size:16px;top:12px;width:22px;height:22px}

/* Compact floating actions in the top-right (replaces the old header). */
.ptop{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:40;display:flex;gap:6px;align-items:center}
.ptopbtn{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 12px;min-width:38px;height:38px;font-size:14px;font-weight:700;cursor:pointer;transition:background .12s,color .12s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ptopbtn:hover{background:var(--hover)}
.ptopbtn:active{transform:scale(.94)}
/* Tiny icon-only variant for the Invite button. */
.ptopbtn.small{padding:0;width:32px;height:32px;min-width:32px;font-size:13px}
.ptopbtn.danger{background:#fff5f5;color:var(--err);border-color:#f8d3d3;padding:8px 14px}
.ptopbtn.danger:hover{background:#ffe4e4}
.ptopbtn .pei{font-size:14px;line-height:1}
/* On mobile the wrap has no top padding — first section sits at 8px.
   Nudge it down so the section header clears the floating actions. */
.psect:first-of-type{margin-top:14px}
@keyframes plive{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* Section headers */
.psect{margin-bottom:26px}
.psect .ph{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.psect .ph h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.1px}
.psect .ph h3 b{color:var(--faint);font-weight:600;font-size:13px;margin-left:6px}
.psect .ph .phelp{font-size:11.5px;color:var(--faint);font-weight:600}

/* Speaker + listener grids — tighter gap so avatars sit close, more
   like a real "room" than a wide-spaced tile grid. */
.speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.listeners{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px}

/* Avatar tile — clean, borderless. Optional coloured ring for host / live.
   Owner ask 15 Aug 2026: avatar is NEVER a mic toggle. Mic lives in the
   dedicated bottom-center .micbtn control below. Avatar-tap is reserved
   for the host-menu (when a host taps someone else) — nothing else. */
.pav{position:relative;text-align:center;padding:8px 2px;border-radius:14px;transition:background .12s;cursor:default}
.pav .circ{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;background:#5a7bff;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:24px;overflow:hidden;position:relative}
.pav .circ img{width:100%;height:100%;object-fit:cover;display:block}
/* Speakers all share the SAME green ring — owner asked: no more
   gold vs blue distinction. Host gets a darker green gradient so
   they're still visually distinct without the crown chip (removed
   15 Aug 2026 per owner: 'no crown in the party avatars anywhere'). */
.pav.host .circ,.pav.speaker .circ{outline:3px solid var(--green);outline-offset:2px;background:linear-gradient(135deg,#5a7bff,#7c5cff)}
.pav.host .circ{background:linear-gradient(135deg,#22c07a,#159f5d)}
/* Live-mic pulse: still green, just a brighter outer glow */
.pav.live .circ::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:plive 1.2s ease-out infinite}
/* Mic mute/unmute badge — a cute circular chip sitting bottom-right of
   the avatar. Shows for EVERY speaker (host + speaker), driven by their
   live mic state. Owner ask: "make the cute mic icon on the profile
   icon mute unmute display". */
/* Mic chip: tucked bottom-right of the avatar circle. Soft grey when
   muted (WhatsApp-style, no alarming red), green when live. Present on
   every speaker + host — tap the avatar to toggle your own. */
.pav .micchip{position:absolute;bottom:34px;right:calc(50% - 34px);background:#6b7280;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:background .18s,transform .1s;padding:4px}
.pav .micchip svg{width:100%;height:100%;display:block}
.pav .micchip.on{background:linear-gradient(135deg,#22c07a,#159f5d)}
/* Mic chip is a status indicator only — never a tap target. The
   dedicated .micbtn owns the mic toggle. */
.pav .micchip{pointer-events:none}
/* Quality chip: bottom-LEFT of the avatar circle (mirror of the mic
   chip at bottom-right). Shown only when a speaker's outbound
   connection to the SFU is 'weak' or 'bad' — good stays hidden so
   healthy avatars stay clean. Owner ask 15 Aug 2026: 'if some
   connection is bad or less as host or speaker, please show a red
   signal on their profile so they know'. */
.pav .qualchip{position:absolute;bottom:34px;left:calc(50% - 34px);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);padding:4px}
.pav .qualchip svg{width:100%;height:100%;display:block}
.pav .qualchip.weak{background:linear-gradient(135deg,#f5a623,#d98a12)}
.pav .qualchip.bad{background:linear-gradient(135deg,#ff4d4f,#c92027);animation:qualpulse 1.2s ease-in-out infinite}
@keyframes qualpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.listeners .pav .qualchip{display:none}
/* Crown chip removed 15 Aug 2026 (owner ask). Host is still visible
   via the darker green gradient on .pav.host .circ above. */
/* "Tap to mute" hint removed 15 Aug 2026 — the avatar is no longer
   a mic control. The dedicated .micbtn at the bottom owns that job. */
.pav .nm{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
/* Role sublabel retired — the crown chip already signals host and the
   avatar-column position tells you speaker vs listener. */
.pav .rl{display:none}

.listeners .pav{padding:6px 2px}
.listeners .pav .circ{width:44px;height:44px;font-size:17px;margin-bottom:6px}
.listeners .pav .nm{font-size:11px}
.listeners .pav .rl{display:none}
/* Listener tiles don't show the mic chip (they can't speak until
   promoted). Speakers + hosts show it so everyone can see who's
   muted vs live — Tandem-style (owner ask 11 Aug 2026 — 'mic on
   their picture on and off, all people can see who's muted'). */
.listeners .pav .micchip{display:none}
/* Listener with hand raised */
.pav.hand::before{content:'✋';position:absolute;top:0;right:6px;font-size:14px;background:#fff8e6;padding:3px 5px;border-radius:99px;border:1px solid #f0d97a;animation:handwave 1.3s ease-in-out infinite}
@keyframes handwave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

/* Contextual actions row — appears below a speaker/listener when host taps */
.pav.selected{background:var(--hover)}
.pav-menu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:none;flex-direction:column;gap:2px;z-index:10;min-width:130px}
.pav.selected .pav-menu{display:flex}
.pav-menu button{background:transparent;color:var(--ink);border:0;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:6px;text-align:left;cursor:pointer;white-space:nowrap}
.pav-menu button:hover{background:var(--hover)}
.pav-menu button.danger{color:var(--err)}

/* Raise-hand queue for hosts */
.hostqueue{background:#fff8e6;border:1px solid #f0d97a;border-radius:14px;padding:12px 14px;margin-bottom:22px}
.hostqueue .hqhdr{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--host-ink);margin-bottom:10px}
.hostqueue .hqrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0d97a}
.hostqueue .hqrow:first-of-type{border-top:0}
.hostqueue .hqav{width:32px;height:32px;border-radius:50%;background:#f5b52e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.hostqueue .hqav img{width:100%;height:100%;object-fit:cover}
.hostqueue .hqnm{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
.hostqueue .hqbtns{display:flex;gap:6px;flex-shrink:0}
.hostqueue .hqbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:12px;cursor:pointer}
.hostqueue .hqbtn.deny{background:#fff;color:var(--sub);border:1px solid var(--line)}

/* Floating action pills above the chat panel — always visible, impossible
   to miss. Two variants: mic (speakers), raise-hand (listeners). Only
   ONE ever shows at a time based on the user's role. */
/* Tandem-style mic pill: big, soft, rounded. Off = white with dark
   text, mic in a soft grey chip. On = full green with subtle glow. */
.micfab,.handfab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:12px;border:1px solid var(--line);border-radius:99px;padding:12px 22px 12px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,background .18s,box-shadow .18s,color .18s;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.micfab.show,.handfab.show{display:inline-flex}
.micfab{background:#fff;color:var(--ink)}
.micfab .mfico{width:38px;height:38px;border-radius:50%;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:background .18s,color .18s}
.micfab.on{background:linear-gradient(135deg,#22c07a,#159f5d);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(34,192,122,.35),0 0 0 6px rgba(34,192,122,.12);animation:tandemBreathe 2.2s ease-in-out infinite}
.micfab.on .mfico{background:rgba(255,255,255,.22);color:#fff}
.micfab:hover,.handfab:hover{transform:translateX(-50%) translateY(-2px)}
.micfab:active,.handfab:active{transform:translateX(-50%) scale(.97)}
@keyframes tandemBreathe{0%,100%{box-shadow:0 10px 26px rgba(34,192,122,.35),0 0 0 6px rgba(34,192,122,.12)}50%{box-shadow:0 10px 26px rgba(34,192,122,.45),0 0 0 12px rgba(34,192,122,.08)}}
/* Raise-hand: red pill so it screams "ask to speak" — owner's ask. */
.handfab{background:#d93025;box-shadow:0 6px 18px rgba(217,48,37,.32)}
.handfab.up{background:#a52618;box-shadow:0 6px 18px rgba(165,38,24,.4)}
.handfab .hfico{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
@media(max-width:480px){
  .micfab,.handfab{bottom:calc(150px + env(safe-area-inset-bottom));padding:10px 18px 10px 12px;font-size:14px}
  .micfab .mfico,.handfab .hfico{width:28px;height:28px;font-size:14px}
}

/* ══ Dedicated mic control (owner ask 15 Aug 2026) ══
   Bottom-center floating pill, ~64px, ONE clear affordance for the
   speaker/host to toggle their mic. Replaces the old avatar-tap
   toggle (which caused accidental mutes when people just wanted to
   see a profile). Grey when muted, green with a soft pulse when
   speaking. Hidden entirely for listeners. Same handler as before
   (toggleMyMic()) — no duplicate mic logic. */
.micbtn{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;height:72px;border-radius:50%;border:0;padding:0;background:#6b7280;color:#fff;cursor:pointer;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:700;box-shadow:0 10px 28px rgba(0,0,0,.22);transition:background .18s,box-shadow .18s,transform .1s}
.micbtn.show{display:inline-flex}
.micbtn:hover{transform:translateX(-50%) translateY(-2px)}
.micbtn:active{transform:translateX(-50%) scale(.95)}
.micbtn:focus-visible{outline:3px solid #7c5cff;outline-offset:3px}
.micbtn .mbico{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center}
.micbtn .mbico svg{width:100%;height:100%;display:block}
.micbtn .mblbl{font-size:10.5px;font-weight:800;letter-spacing:.2px;line-height:1;margin-top:1px;text-transform:uppercase}
.micbtn.on{background:linear-gradient(135deg,#22c07a,#159f5d);box-shadow:0 10px 28px rgba(34,192,122,.4),0 0 0 6px rgba(34,192,122,.14);animation:micbtnPulse 2.2s ease-in-out infinite}
@keyframes micbtnPulse{0%,100%{box-shadow:0 10px 28px rgba(34,192,122,.4),0 0 0 6px rgba(34,192,122,.14)}50%{box-shadow:0 10px 28px rgba(34,192,122,.5),0 0 0 14px rgba(34,192,122,.06)}}
/* Nudge above the raise-hand FAB / quickact stack on mobile so it
   doesn't collide with them. On desktop the wrap uses a right-column
   chat rail — recentre relative to the members column. */
@media(min-width:1000px){
  .micbtn{left:auto;right:calc(380px + 44px + 72px);transform:none;bottom:32px}
  .micbtn:hover{transform:translateY(-2px)}
  .micbtn:active{transform:scale(.95)}
}
/* When the party runs inside /social's mini-player iframe the parent
   collapses the iframe to a tiny bar — the button never renders in a
   visible viewport. When restored to fullscreen the iframe is at
   full size again and the button re-appears. No extra guard needed. */

/* Owner ask 10 Aug 2026 — 'remove the entire chat functionality from
   parties'. We keep the raise-hand button visible (it lives inside
   .pcompose) but hide everything chat-related: quota, messages, text
   input, emoji picker + button, send button. Voice + raise-hand +
   reactions-via-avatar remain intact. */
#pChat .pquota,
#pChat .pmsgs,
#pChat .pemoji-pick,
#pChat .pinput,
#pChat .pemo,
#pChat #pSendBtn{display:none !important}
/* When only the raise-hand slot remains, shrink the panel padding so
   it doesn't leave a big empty white block at the bottom. */
#pChat.chat-off{background:transparent;border-top:0;padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
#pChat.chat-off::before{display:none}
/* Bottom chat panel — soft top-fade + generous padding. */
.pchat{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:30}
.pchat::before{content:'';position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.pmsgs{max-width:640px;margin:0 auto 8px;max-height:200px;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.pmsg{background:var(--panel);border-radius:16px;padding:8px 12px;font-size:13.5px;line-height:1.45;word-break:break-word;color:var(--ink);max-width:82%;align-self:flex-start}
.pmsg .pmwho{font-weight:800;font-size:11px;color:var(--accent);margin-right:6px}
.pmsg .pmwho.host{color:var(--host-ink)}
.pmsg.mine{background:linear-gradient(135deg,#5a7bff,#7c5cff);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.pmsg.mine .pmwho{color:rgba(255,255,255,.85)}
.pmsg:not(.mine){border-bottom-left-radius:6px}

.pcompose{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.pcompose .pinput{flex:1;background:var(--panel);border:1px solid transparent;color:var(--ink);font-family:inherit;font-size:14.5px;padding:11px 16px;border-radius:99px;outline:none;min-width:0;transition:border-color .12s,background .12s,box-shadow .12s}
.pcompose .pinput:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(90,123,255,.12)}
.pcompose .pinput:disabled{opacity:.55}
.pcompose .pbtn{background:var(--accent);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,transform .1s}
.pcompose .pbtn:hover{background:#4a68e0}
.pcompose .pbtn:active{transform:scale(.94)}
.pcompose .pbtn:disabled{opacity:.45;cursor:default}
.pcompose .pemo{background:var(--panel);color:var(--ink);border:0;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;transition:background .12s}
.pcompose .pemo:hover{background:var(--hover)}
/* raise-hand button that replaces the mic slot for listeners */
.pcompose .praise{display:none}   /* replaced by the big FAB below */
.pquota{max-width:640px;margin:0 auto 5px;text-align:center;font-size:11.5px;color:var(--sub);font-weight:600}
.pquota .pq-strong{color:var(--ink)}
.pquota .pq-none{color:var(--err)}

/* Emoji burst dock */
.pemoji-pick{max-width:640px;margin:0 auto 6px;display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;gap:2px}
.pemoji-pick.show{display:flex;flex-wrap:wrap;justify-content:center}
.pemoji-pick button{background:transparent;color:var(--ink);border:0;font-size:22px;padding:6px 10px;border-radius:8px;cursor:pointer}
.pemoji-pick button:hover{background:var(--hover)}

/* Header action buttons */
.pinvite{background:#eef1ff;color:#4358d1;border:1px solid #d0d7ff;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:8px;transition:background .12s}
.pinvite:hover{background:#dee4ff}
.pinvite.done{background:#e8f9ef;color:#159f5d;border-color:#c1e6d1}
.pleave{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:8px;transition:background .12s}
.pleave:hover{background:var(--hover);color:var(--ink)}
.pend{background:#fff5f5;color:var(--err);border:1px solid #f8d3d3;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:6px;transition:background .12s}
.pend:hover{background:#ffe4e4}

/* Speaking ring — pulses on the avatar of whoever is actively talking
   right now. Sits on top of the existing gold/blue role rings. */
.pav.speaking .circ{box-shadow:0 0 0 3px var(--green),0 0 0 8px rgba(34,192,122,.28);animation:speakpulse 1.1s ease-in-out infinite}
@keyframes speakpulse{0%,100%{box-shadow:0 0 0 3px var(--green),0 0 0 8px rgba(34,192,122,.20)}50%{box-shadow:0 0 0 3px var(--green),0 0 0 14px rgba(34,192,122,.10)}}

/* Compact mute + reactions pair, bottom-right of the viewport. Two
   round icon buttons instead of the big pill for people who want
   less UI. The reactions menu pops upward when tapped. */
.quickact{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:36;display:none;flex-direction:column;gap:8px;align-items:flex-end}
.quickact.show{display:flex}
.quickact .qmute,.quickact .qrx,.quickact .qinv,.quickact .qend{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.10);transition:transform .12s,background .12s,color .12s;display:flex;align-items:center;justify-content:center}
.quickact .qmute:hover,.quickact .qrx:hover,.quickact .qinv:hover,.quickact .qend:hover{transform:translateY(-2px)}
.quickact .qmute.on{background:linear-gradient(135deg,#22c07a,#159f5d);color:#fff;border-color:transparent;animation:speakpulse 1.4s ease-in-out infinite}
.quickact .qend{background:#fff5f5;color:var(--err);border-color:#f8d3d3}
.quickact .qinv.done{background:#e8f9ef;color:#159f5d;border-color:#c1e6d1}
.quickact .qrxmenu{display:none;position:absolute;bottom:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.15);width:230px}
.quickact .qrxmenu.show{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.quickact .qrxmenu button{background:transparent;border:0;font-size:22px;padding:6px 4px;border-radius:8px;cursor:pointer;line-height:1;transition:background .12s,transform .06s}
.quickact .qrxmenu button:hover{background:var(--hover);transform:scale(1.15)}
@media(max-width:640px){ .quickact{right:12px;bottom:calc(148px + env(safe-area-inset-bottom))} }
@media(min-width:1000px){ .quickact{bottom:96px} }

/* Toasts */
.ptoast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;pointer-events:none;opacity:0;transition:.2s}
.ptoast.show{opacity:1;top:24px}

/* ═══ 1c Party reskin (talksibi rebrand) ═══
   Design handoff §1c + tokens §12. Placed at the END of <style> so it
   wins the cascade cleanly without touching the historical rules above.
   RESKIN ONLY — no IDs renamed, no JS handlers touched, no DOM added.
   All Cloudflare Realtime SFU wiring, wsVoice.* calls, socket events
   ('v-mic', 'v-tracks', 'v-quality', 'v-hand'), reconnect button and
   the dedicated .micbtn logic are untouched.

   Spec-vs-existing conflicts I resolved:
   • Spec §1c calls for a LIVE pill + Topic card in the top strip.
     The current DOM has neither slot (no #pTopic, no LIVE element).
     Restyle-only forbids adding DOM, so both are skipped — the party
     header keeps its existing title / subtitle / reconnect / end
     shape, restyled to the dark palette.
   • Spec avatars = 58px flat-tinted disks with a fixed green border.
     Current code uses gradient fills + role-conditional outlines
     driven by state. I keep the state-driven variants (host / speaker
     / speaking / live) and only recolour rings + backgrounds to the
     talksibi green/periwinkle palette.
   • ts-pulse / ts-dot animations from the design are added below.
*/
:root{
  --ts-ink:#16181f; --ts-card:#1d2130; --ts-border:#2a2e42;
  --ts-text:#ffffff; --ts-mute:#9aa0b4; --ts-mute2:#cdd2e4;
  --ts-peri:#5b6cff; --ts-peri-on-dark:#8f9bff;
  --ts-green:#1fb28a; --ts-green-on-dark:#43cfa5;
  --ts-live:#d9544d; --ts-gold-on-dark:#ffd575;
}
@keyframes ts-pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes ts-dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}

/* Body + shell — dark ambient */
body{background:var(--ts-ink);color:var(--ts-text);
  font-family:'Hanken Grotesk','Nunito',system-ui,-apple-system,sans-serif}
.wrap{color:var(--ts-text)}

/* Header — dark card row with a subtle divider under it */
.phead{border-bottom:1px solid var(--ts-border);padding-bottom:12px}
.phead-txt h1{
  color:var(--ts-text);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif;
  font-weight:600;font-size:16px;letter-spacing:-.1px
}
.phead-txt p{color:var(--ts-mute);font-weight:500}
/* Language chips restyled to sit on dark */
.phead-langs .plchip{
  background:rgba(139,148,180,0.14);color:var(--ts-mute2);
  border:1px solid var(--ts-border);
  font-family:'Hanken Grotesk','Nunito',system-ui,sans-serif;font-weight:600
}
/* Reconnect + End buttons — muted dark chips */
.pheadRec{
  background:rgba(91,108,255,0.14);color:var(--ts-peri-on-dark);
  border:1px solid rgba(91,108,255,0.35);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.pheadRec:hover{background:rgba(91,108,255,0.22);border-color:rgba(91,108,255,0.5)}
.pheadEnd{
  background:rgba(217,84,77,0.14);color:#ff8a84;
  border:1px solid rgba(217,84,77,0.35);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.pheadEnd:hover{background:rgba(217,84,77,0.22)}
.pheadLeave{
  background:#0f1119;color:var(--ts-text);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.pheadLeave:hover{background:#000}

/* Section headers — UPPERCASE label per §12 tokens */
.psect .ph h3{
  color:var(--ts-mute);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif;
  font-weight:600;font-size:13px;letter-spacing:2.5px;text-transform:uppercase
}
.psect .ph h3 b{color:var(--ts-mute)}
.psect .ph .phelp{color:var(--ts-mute)}

/* Speaker + listener grid tiles — 58px flat-tinted disks, green ring
   for speakers, dashed periwinkle for the free-seat placeholder.
   Existing state classes (.pav.host / .pav.speaker / .pav.speaking /
   .pav.live / .pav.hand / .pav.selected) all still drive the look — I
   just change the palette. */
.pav .circ{
  background:var(--ts-peri);color:var(--ts-text);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.speakers .pav .circ{width:58px;height:58px;font-size:21px}
/* Speaker (non-host) ring = solid green */
.pav.speaker .circ{
  background:linear-gradient(135deg,#5b6cff,#7c5cff);
  outline:none;border:3px solid var(--ts-green);
  box-shadow:0 0 0 3px rgba(31,178,138,0.25)
}
/* Host = amber-ish tint disk, still with green ring (matches spec's
   Mariana + Amira tiles). */
.pav.host .circ{
  background:linear-gradient(135deg,#22c07a,#159f5d);
  outline:none;border:3px solid var(--ts-green);
  box-shadow:0 0 0 3px rgba(31,178,138,0.25)
}
/* Live speaking pulse — spec: box-shadow 0 0 0 3px rgba(31,178,138,0.25)
   plus a soft outer glow. Kept on the same .speaking / .live triggers. */
.pav.speaking .circ,
.pav.live .circ{
  border-color:var(--ts-green);
  box-shadow:0 0 0 3px rgba(31,178,138,0.35),0 0 0 8px rgba(31,178,138,0.18);
  animation:ts-speak 1.4s ease-in-out infinite
}
@keyframes ts-speak{
  0%,100%{box-shadow:0 0 0 3px rgba(31,178,138,0.35),0 0 0 8px rgba(31,178,138,0.18)}
  50%{box-shadow:0 0 0 3px rgba(31,178,138,0.45),0 0 0 14px rgba(31,178,138,0.08)}
}
.pav .nm{color:var(--ts-text);font-weight:500;font-size:11.5px;
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif}
.pav .rl{color:var(--ts-mute)}
/* Listener tile tweaks — smaller circles, no ring, muted names */
.listeners .pav .circ{
  background:linear-gradient(135deg,#3a3f55,#2a2e42);
  outline:none;border:2px solid rgba(255,255,255,0.06);box-shadow:none
}
.listeners .pav .nm{color:var(--ts-mute2)}

/* Host contextual menu — dark card matching the palette */
.pav.selected{background:rgba(91,108,255,0.10)}
.pav-menu{
  background:var(--ts-card);border-color:var(--ts-border);
  box-shadow:0 12px 30px rgba(0,0,0,.55)
}
.pav-menu button{color:var(--ts-text)}
.pav-menu button:hover{background:rgba(255,255,255,0.06)}

/* Host raise-hand queue — dark card, gold accents on dark */
.hostqueue{
  background:rgba(255,201,77,0.10);border:1px solid rgba(255,201,77,0.32)
}
.hostqueue .hqhdr{color:var(--ts-gold-on-dark);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif}
.hostqueue .hqrow{border-top-color:rgba(255,201,77,0.25)}
.hostqueue .hqnm{color:var(--ts-text)}
.hostqueue .hqbtn{
  background:var(--ts-green);color:#fff;
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.hostqueue .hqbtn.deny{
  background:transparent;color:var(--ts-mute2);
  border:1px solid var(--ts-border)
}

/* Corner quick-actions — dark round chips */
.quickact .qmute,
.quickact .qrx,
.quickact .qinv,
.quickact .qend{
  background:var(--ts-card);color:var(--ts-text);
  border:1px solid var(--ts-border);
  box-shadow:0 6px 18px rgba(0,0,0,.35)
}
.quickact .qend{background:rgba(217,84,77,0.18);color:#ff8a84;border-color:rgba(217,84,77,0.35)}
.quickact .qinv.done{background:rgba(31,178,138,0.18);color:var(--ts-green-on-dark);border-color:rgba(31,178,138,0.35)}
.quickact .qrxmenu{
  background:var(--ts-card);border-color:var(--ts-border);
  box-shadow:0 12px 30px rgba(0,0,0,.55)
}
.quickact .qrxmenu button{color:var(--ts-text)}
.quickact .qrxmenu button:hover{background:rgba(255,255,255,0.08)}

/* Raise-hand FAB — keep the coral/red intent but softened on dark */
.handfab{background:var(--ts-live);box-shadow:0 6px 18px rgba(217,84,77,.35)}
.handfab.up{background:#b3413a}
.handfab{font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif}

/* Dedicated mic control — spec green (#1fb28a) instead of the older
   #22c07a. Owner just redesigned this button — I only recolour it,
   keep its size / position / show/hide behavior wired to .show/.on. */
.micbtn{
  background:#2a2e42;color:var(--ts-text);
  box-shadow:0 10px 28px rgba(0,0,0,.45);
  font-family:'Hanken Grotesk','Fredoka','Nunito',system-ui,sans-serif
}
.micbtn.on{
  background:linear-gradient(135deg,#1fb28a,#159c74);
  box-shadow:0 10px 28px rgba(31,178,138,.4),0 0 0 6px rgba(31,178,138,.14);
  animation:tsMicPulse 2.2s ease-in-out infinite
}
@keyframes tsMicPulse{
  0%,100%{box-shadow:0 10px 28px rgba(31,178,138,.4),0 0 0 6px rgba(31,178,138,.14)}
  50%{box-shadow:0 10px 28px rgba(31,178,138,.5),0 0 0 14px rgba(31,178,138,.06)}
}

/* Chat panel — dark surface, compact bubbles per spec */
.pchat{
  background:var(--ts-ink);border-top:1px solid var(--ts-border);
  color:var(--ts-text)
}
.pchat::before{background:linear-gradient(to top,rgba(22,24,31,.95),rgba(22,24,31,0))}
.pmsg{
  background:rgba(255,255,255,0.06);color:var(--ts-mute2);
  font-size:12.5px;
  font-family:'Hanken Grotesk','Nunito',system-ui,sans-serif
}
.pmsg .pmwho{color:var(--ts-peri-on-dark)}
.pmsg .pmwho.host{color:var(--ts-gold-on-dark)}
.pmsg.mine{
  background:var(--ts-peri);color:#fff
}
.pmsg.mine .pmwho{color:rgba(255,255,255,.9)}
/* Typing dots (spec §1c uses ts-dot). Not currently emitted by JS —
   styling reserved for a future socket-driven .ts-typing element so
   the animation is ready when it lands. */
.ts-typing{display:inline-flex;gap:4px;padding:4px 0}
.ts-typing span{
  width:6px;height:6px;border-radius:50%;
  background:var(--ts-mute);animation:ts-dot 1s infinite
}

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Language-name → flag emoji lookup for the header chips. Kept local so
// party.html has no runtime dependency on /social.html's constants.
// Owner ask 14 Aug 2026: show flag + name of the party's language(s).
// Mirrors the master LANGS list in /social.html — when adding a
// language, update both places. Alphabetised.
const PARTY_LANG_FLAG = {
  Amharic:'🇪🇹', Arabic:'🇸🇦', Armenian:'🇦🇲', Azerbaijani:'🇦🇿',
  Bengali:'🇧🇩', Bulgarian:'🇧🇬', Burmese:'🇲🇲', Chinese:'🇨🇳',
  Croatian:'🇭🇷', Czech:'🇨🇿', Danish:'🇩🇰', Dutch:'🇳🇱',
  English:'🇬🇧', Estonian:'🇪🇪', Finnish:'🇫🇮', French:'🇫🇷',
  Georgian:'🇬🇪', German:'🇩🇪', Greek:'🇬🇷', Gujarati:'🇮🇳',
  Hebrew:'🇮🇱', Hindi:'🇮🇳', Hungarian:'🇭🇺', Icelandic:'🇮🇸',
  Indonesian:'🇮🇩', Italian:'🇮🇹', Japanese:'🇯🇵', Kazakh:'🇰🇿',
  Khmer:'🇰🇭', Korean:'🇰🇷', Kurdish:'🇮🇶', Latvian:'🇱🇻',
  Lithuanian:'🇱🇹', Malay:'🇲🇾', Mandarin:'🇨🇳', Marathi:'🇮🇳',
  Nepali:'🇳🇵', Norwegian:'🇳🇴', Persian:'🇮🇷', Polish:'🇵🇱',
  Portuguese:'🇵🇹', Punjabi:'🇮🇳', Romanian:'🇷🇴', Russian:'🇷🇺',
  Serbian:'🇷🇸', Sinhala:'🇱🇰', Slovak:'🇸🇰', Spanish:'🇪🇸',
  Swahili:'🇰🇪', Swedish:'🇸🇪', Tagalog:'🇵🇭', Tamil:'🇮🇳',
  Telugu:'🇮🇳', Thai:'🇹🇭', Turkish:'🇹🇷', Ukrainian:'🇺🇦',
  Urdu:'🇵🇰', Uzbek:'🇺🇿', Vietnamese:'🇻🇳', Yoruba:'🇳🇬',
  Zulu:'🇿🇦', Any:'🌍'
};
function paintPartyLangs(langs){
  const host = $('pLangs'); if (!host) return;
  const arr = Array.isArray(langs) ? langs : [];
  if (!arr.length) { host.classList.add('hidden'); host.innerHTML = ''; return; }
  host.innerHTML = arr.slice(0, 4).map(l =>
    `<span class="plchip"><span class="fl">${PARTY_LANG_FLAG[l] || '🌐'}</span>${esc(l)}</span>`
  ).join('');
  host.classList.remove('hidden');
}
const params = new URLSearchParams(location.search);
let CODE = (params.get('room') || '').trim().toUpperCase();
const EMBED = params.get('embed') === '1';   // true when hosted inside /social's iframe
let socket = null, room = null, myId = null, myRole = 'listener', msgsLeft = 2, myHandUp = false, selectedMemberId = null;
let ME_UID = null;   // set from the 'joined' event; used by the host-reclaim fallback
let SPEAKING = new Set();   // socket ids currently detected as talking
let QUALITY = {};           // trackId → connection quality (0..3, higher = better)
let MY_QUALITY = 'good';    // my own outbound bucket ('good' | 'weak' | 'bad')
let _myQualToasted = false; // one-time toast when MY link first drops
let _wakeLock = null;       // navigator.wakeLock handle so we can release it

// Wake Lock: keep the phone screen awake while in a party so mobile
// browsers don't suspend the tab after screen dim. Silently unsupported
// on Firefox / older Safari — no-op.
async function acquireWakeLock(){
  if (!('wakeLock' in navigator)) return;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
  } catch(e){ /* denied / not-focused / no perm — silent */ }
}
function releaseWakeLock(){
  if (!_wakeLock) return;
  try { _wakeLock.release(); } catch(e){}
  _wakeLock = null;
}
// Re-acquire on visibility return — the browser drops the lock when
// the tab loses focus.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !_wakeLock && room) acquireWakeLock();
});

// Talk to the parent /social if we're embedded — used to close the host
// iframe when the party ends, minimize on user gesture, etc.
function postToParent(msg){
  if (!EMBED) return;
  try { parent.postMessage(msg, location.origin); } catch(e){}
}
if (EMBED) {
  // Hide the standalone back button — the parent owns navigation now.
  document.addEventListener('DOMContentLoaded', () => {
    const back = document.querySelector('.pback'); if (back) back.style.display = 'none';
    // Parent listens for a leave request from inside.
    window.addEventListener('message', (ev) => {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.type === 'party:leave') leaveOrEnd();
      if (ev.data && ev.data.type === 'party:end') { try { socket && socket.emit('closeParty'); } catch(e){} setTimeout(leaveAndGo, 120); }
    });
  });
}

// Boot: load room + open socket + auto-join. There's no separate "Join" tap
// any more — the whole point of opening /party?room=... IS to join, so we
// do that immediately.
async function boot(){
  if (!CODE) { alert('No party code in the URL.'); location.href = '/social'; return; }
  // Owner ask 14 Aug 2026: "guests should NOT be able to join a party —
  // push them to make an account first." Pre-check identity here so we
  // bounce anonymous visitors straight to the signup/login flow, with
  // ?next= so a successful sign-up drops them right back into this party.
  try {
    const meR = await fetch('/api/social/me', { cache: 'no-store', credentials: 'include' });
    const meJ = await meR.json();
    if (!meJ || !meJ.me) {
      const next = encodeURIComponent('/party?room=' + CODE);
      location.replace('/social?login=1&next=' + next);
      return;
    }
  } catch (e) {
    // If the identity check itself fails, don't lock the host out —
    // fall through and let the socket-side guard have the last word.
  }
  try {
    const r = await fetch('/api/parties/' + encodeURIComponent(CODE));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Party not found.');
    room = j.room;
    $('pTitle').textContent = room.title;
    // Always show a subtitle: room's own tagline if set, else the room
    // code so guests can read it off the header.
    $('pSub').textContent = room.subtitle || ('Code · ' + CODE);
    paintPartyLangs(room.langs);
  } catch(e){ alert(e.message); location.href = '/social'; return; }
  // Open the socket + auto-join.
  conn().emit('join', { code: CODE });
}

function conn(){
  if (socket) return socket;
  socket = io('/party');
  socket.on('state', st => {
    room = st;
    // Sync myRole from server truth. Without this the client stays in its
    // 'joined' role forever, so a demoted speaker keeps canPublish=true and
    // can just re-open the mic. Owner-reported: "speaker who goes to
    // listener is still able to speak." Fix both the role, the voice
    // module's canPublish flag, and hard-stop the mic on the transition.
    if (myId && room && room.members) {
      const meRow = room.members.find(m => m.id === myId);
      if (meRow && meRow.role && meRow.role !== myRole) {
        const wasSpeaker = (myRole === 'host' || myRole === 'speaker');
        myRole = meRow.role;
        const nowSpeaker = (myRole === 'host' || myRole === 'speaker');
        if (window.wsVoice) {
          // Tear the mic down BEFORE flipping canPublish — setMic still
          // has to complete the unpublish path, and we don't want the
          // guard to bounce it.
          if (wasSpeaker && !nowSpeaker) {
            try { wsVoice.setMic(false); } catch(e){}
          }
          try { wsVoice.setCanPublish(nowSpeaker); } catch(e){}
        }
        paintQuota();
        paintRaiseBtn();
      }
    }
    paint();
  });
  socket.on('joined', d => {
    myId = d.you; myRole = d.role; msgsLeft = d.msgsLeft || 0;
    ME_UID = d.uid || null;
    $('pChat').classList.remove('hidden');
    if (myRole === 'host') $('pEndBtn').classList.remove('hidden');
    paintQuota();
    paintRaiseBtn();
    // Voice — publisher if host/speaker, listener otherwise. Voice module
    // handles CF SFU vs P2P internally.
    if (window.wsVoice) {
      wsVoice.setMyId(myId);
      wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
      wsVoice.init({ socket, myId, canPublish: (myRole === 'host' || myRole === 'speaker') });
      wsVoice.on('mic', () => paint());       // avatar ring reflects mic state
      // Loud publish-failure feedback: if the Cloudflare push silently fails
      // the user thinks they're speaking but the room hears nothing. Toast +
      // nudge to the Reconnect button. (Owner bug 15 Aug 2026.)
      wsVoice.on('publish-fail', () => {
        toast('⚠️ Mic didn\'t publish — tap 🔄 Reconnect');
      });
      // Keep the phone screen awake while the user is in the party.
      acquireWakeLock();
      // Poll connection stats every 3s + repaint avatars with dots.
      wsVoice.startQualityPoll();
      wsVoice.on('quality', (map) => { QUALITY = map || {}; paint(); });
      // Outbound (my own upload) quality: start polling when the mic
      // actually opens (listeners have no outbound stream to score),
      // stop when it closes. Broadcast bucket transitions to the room
      // so everyone's memberCard renders the signal chip on my avatar.
      wsVoice.on('mic', (d) => {
        if (!wsVoice.startOutboundQualityPoll) return;
        if (d && d.on) {
          wsVoice.startOutboundQualityPoll();
        } else {
          wsVoice.stopOutboundQualityPoll();
          // stopOutboundQualityPoll emits a synthetic 'good' — but be
          // defensive in case that changes: force local state + broadcast.
          if (MY_QUALITY !== 'good') {
            MY_QUALITY = 'good';
            try { socket.emit('v-quality', { bucket: 'good' }); } catch (e) {}
            paint();
          }
          _myQualToasted = false;
        }
      });
      wsVoice.on('outbound-quality', (d) => {
        const b = (d && d.bucket) || 'good';
        MY_QUALITY = b;
        try { socket.emit('v-quality', { bucket: b }); } catch (e) {}
        // One-time toast the first time my link goes weak/bad in this session,
        // so I know it's ME, not the other side. Reset flag on 'good' via
        // the mic-off handler above; also reset when we clear back to good.
        if (b === 'bad' && !_myQualToasted) {
          _myQualToasted = true;
          toast('Your connection is bad — audio quality may drop.');
        } else if (b === 'good') {
          _myQualToasted = false;
        }
        paint();
      });
      // Remote-speaker detection — audioLevel per inbound track (0..1).
      // Above 0.02 counts as "speaking"; a member gets the pulsing green
      // ring for 1.5s after their last spike so mid-sentence gaps don't
      // strobe it off.
      let clearT = {};
      wsVoice.on('levels', (levelsByTrack) => {
        // trackIdentifier maps to member via room.members[].cfSession is
        // the peer's SFU session and their tracks are stamped there; but
        // the browser's own trackIdentifier for a remote track equals the
        // CF trackName they published. Match either.
        Object.entries(levelsByTrack || {}).forEach(([tid, lvl]) => {
          if (lvl < 0.02) return;
          const owner = (room && room.members || []).find(m => (m.tracks || []).includes(tid) || m.cfSession === tid);
          const id = owner && owner.id; if (!id) return;
          SPEAKING.add(id);
          clearTimeout(clearT[id]);
          clearT[id] = setTimeout(() => { SPEAKING.delete(id); paint(); }, 1500);
        });
        paint();
      });
      // Local mic — pulse OUR own avatar without waiting for the SFU
      // round-trip. Uses an AudioContext analyser on the local stream.
      let mineClearT = null;
      wsVoice.on('local-level', (lvl) => {
        if (!myId) return;
        if (lvl > 0.06) {
          SPEAKING.add(myId);
          clearTimeout(mineClearT);
          mineClearT = setTimeout(() => { SPEAKING.delete(myId); paint(); }, 900);
          paint();
        }
      });
    }
    // (Emoji socket handler moved OUT of this joined callback — see
    // below. Registering it inside 'joined' meant every reconnect stacked
    // another listener, doubling/tripling bursts, and any emoji arriving
    // before 'joined' fired was silently dropped.)
    // Defensive: if the server seated me as a non-host but the room
    // was actually created by me, ask it to reclaim host. Server verifies
    // the uid so this can't be spoofed by anyone else. Slight delay so
    // the first state broadcast has time to arrive with room.hostUid.
    setTimeout(() => {
      if (!room || !socket || !socket.connected) return;
      if (myRole !== 'host' && room.hostUid && ME_UID && room.hostUid === ME_UID) {
        socket.emit('reclaimHost');
      }
    }, 800);
  });
  socket.on('chat', addMsg);
  // Emoji socket handler — registered ONCE at socket-init time so it
  // catches every emoji broadcast (server uses nsp.to(room.code) which
  // includes the sender). Both remote and local emojis funnel through
  // burstOnMember → activeEmojis Map → reapplyEmojis survives paints.
  socket.on('emoji', d => { if (d && d.e && d.from) burstOnMember(d.from, d.e); });
  // Host demoted me back to listener — force the mic off immediately so
  // I can't keep speaking. Server also stripped my tracks server-side.
  socket.on('force-mute', () => {
    if (window.wsVoice) { try { wsVoice.setMic(false); } catch(e){} }
    toast('You\'re a listener now — mic muted.');
  });
  socket.on('chatMeta', m => { msgsLeft = m.msgsLeft; paintQuota(); });
  socket.on('chatBlocked', d => toast(d.reason || 'Chat blocked'));
  socket.on('replaced', () => toast('You joined from another tab — this one\'s inactive.'));
  socket.on('kicked', () => {
    clearPartySession(); toast('The host removed you from the party.');
    postToParent({ type: 'party:kicked' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  socket.on('closed', () => {
    clearPartySession(); toast('The host ended this party.');
    postToParent({ type: 'party:closed' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  // Server refused the join (party ended / full / private). Show the
   // real reason as a toast AND bounce back to the community after a
   // moment so users aren't stranded on an empty party page.
   socket.on('err', e => {
     const msg = e && e.msg ? e.msg : 'Could not join this party.';
     // Guest hit the socket without an account — hand them off to signup
     // with ?next= so they land back in the party after signing up.
     if (e && e.code === 'auth-required') {
       toast(msg);
       const next = encodeURIComponent('/party?room=' + CODE);
       setTimeout(() => { location.replace('/social?login=1&next=' + next); }, 900);
       return;
     }
     toast(msg);
     if (/party has ended|full|private|invite/i.test(msg)) {
       setTimeout(() => { location.href = '/social'; }, 2200);
     }
   });
  return socket;
}
boot();

// Active emoji bursts, keyed by member id. Every paint() wipes the
// entire members panel via innerHTML rebuild — any .pav-emo we
// appended gets destroyed mid-flight. So we (1) remember active
// emojis here with an expiry timestamp, and (2) re-apply them after
// every paint(). Owner bug 2026-08-01: 'the emoji is not showing for
// all the speaker if i make an emoji it should be visible to all the
// people'.
// TTL matches the CSS animation duration (4s pop-in / plateau / fade).
// Keep-alive Map lets the emoji survive multiple paint() DOM churns
// caused by mic toggles, join/leave, and level events.
const EMOJI_TTL_MS = 4000;
const activeEmojis = new Map();   // memberId -> { emoji, expiresAt }

function reapplyEmojis(){
  const now = Date.now();
  for (const [memberId, entry] of activeEmojis) {
    if (entry.expiresAt <= now) { activeEmojis.delete(memberId); continue; }
    const av = document.querySelector('.pav[data-id="' + CSS.escape(memberId) + '"]');
    if (!av) continue;
    // Always REPLACE any existing .pav-emo — the old one may have
    // already animated to opacity:0 and be invisible. A fresh element
    // re-triggers the CSS animation so the emoji is visibly present
    // whenever the TTL says it should be.
    const prev = av.querySelector('.pav-emo');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.className = 'pav-emo';
    el.textContent = String(entry.emoji);
    av.appendChild(el);
  }
}

// Show a single emoji centered on a member's avatar. Only ONE is visible
// at a time per member — a new emoji replaces the old one.
function burstOnMember(memberId, emoji){
  if (!memberId || !emoji) return;
  activeEmojis.set(memberId, { emoji, expiresAt: Date.now() + EMOJI_TTL_MS });
  const av = document.querySelector('.pav[data-id="' + CSS.escape(memberId) + '"]');
  if (av) {
    const prev = av.querySelector('.pav-emo');
    if (prev) prev.remove();
    const el = document.createElement('div');
    el.className = 'pav-emo';
    el.textContent = String(emoji);
    av.appendChild(el);
  }
  setTimeout(() => {
    const entry = activeEmojis.get(memberId);
    if (entry && entry.emoji === emoji) activeEmojis.delete(memberId);
    const av2 = document.querySelector('.pav[data-id="' + CSS.escape(memberId) + '"]');
    if (av2) {
      const cur = av2.querySelector('.pav-emo');
      if (cur && cur.textContent === String(emoji)) cur.remove();
    }
  }, EMOJI_TTL_MS);
}

function paint(){
  if (!room) return;
  $('pTitle').textContent = room.title;
  $('pSub').textContent = room.subtitle || '';
  paintPartyLangs(room.langs);
  // Refresh the community-app rejoin bridge each state tick.
  markPartySession();
  // Keep the iframe host's title synced with the party's live title.
  postToParent({ type: 'party:title', title: room.title });
  const iAmHost = myRole === 'host';
  const iAmSpeaker = iAmHost || myRole === 'speaker';
  const micOn = window.wsVoice && wsVoice.micOn;

  // Dedicated mic control — bottom-center round pill. Shown to hosts +
  // speakers only. Grey/muted or green/speaking; label + aria-pressed
  // stay in sync so screen readers announce the state change. Owner
  // ask 15 Aug 2026: the ONLY mic toggle in the UI. Same handler as
  // the old avatar tap — no duplicated mic logic.
  const mbtn = $('pMicBtn');
  const mbLbl = $('pMicBtnLbl');
  const mbIco = $('pMicBtnIco');
  if (mbtn && mbLbl && mbIco) {
    mbtn.classList.toggle('show', iAmSpeaker);
    mbtn.classList.toggle('on', !!micOn);
    mbtn.setAttribute('aria-pressed', micOn ? 'true' : 'false');
    mbLbl.textContent = micOn ? 'Speaking' : 'Muted';
    // MIC_ON_SVG / MIC_OFF_SVG are defined inside memberCard() — mirror
    // them here so the button reflects state without needing a member
    // paint. Kept as string literals so we don't tightly couple to
    // memberCard() being called first.
    mbIco.innerHTML = micOn
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>';
  }
  // Compact quick actions — reactions + invite. Mute button removed
  // 15 Aug 2026 (owner ask: 'be professional'): the dedicated
  // .micbtn owns mic toggling now, so the tiny 🎤 in the corner was
  // duplicative and unlabelled.
  const q = $('pQuickAct');
  if (q) {
    q.classList.add('show');
    const qm = $('qMuteBtn');
    if (qm) qm.style.display = 'none';
  }

  const speakers = room.members.filter(m => m.role === 'host' || m.role === 'speaker');
  const listeners = room.members.filter(m => m.role === 'listener');
  $('speakerCnt').textContent = speakers.length;
  $('listenerCnt').textContent = listeners.length;
  $('speakers').innerHTML = speakers.map(m => memberCard(m, true, iAmHost, micOn)).join('');
  $('listeners').innerHTML = listeners.map(m => memberCard(m, false, iAmHost, micOn)).join('');
  // Re-apply any in-flight emoji bursts — paint() just destroyed the
  // .pav DOM elements that held them.
  reapplyEmojis();

  // Chat rail: NEVER rebuild from state. Old code wiped the list on
   // every count change and it wrecked scroll + flashed messages away
   // while they were being read. Now we do it once (first paint) and
   // rely on the socket 'chat' event to append new ones. If we ever
   // reload a fresh room, `_msgsInit` is false → seed once.
   if (!room._msgsInit) {
     $('pMsgs').innerHTML = '';
     (room.messages || []).forEach(addMsg);
     room._msgsInit = true;
   }

  // Detect role change (promoted / demoted) and react.
  const me = room.members.find(m => m.id === myId);
  if (me && me.role !== myRole) {
    const wasListener = myRole === 'listener';
    const wasSpeaker = myRole === 'host' || myRole === 'speaker';
    myRole = me.role;
    if (window.wsVoice) wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
    // If I got demoted to listener, force my mic off even if the server's
    // force-mute event races. Belt-and-braces so a listener can NEVER
    // still be broadcasting.
    if (myRole === 'listener' && wasSpeaker && window.wsVoice && wsVoice.micOn) {
      try { wsVoice.setMic(false); } catch(e){}
    }
    if (myRole === 'host') { msgsLeft = 999; toast('You\'re now a co-host! Full mic + unlimited chat.'); myHandUp = false; }
    else if (myRole === 'speaker') { msgsLeft = 999; toast('You\'re a speaker! Tap your avatar to talk.'); myHandUp = false; }
    else if (wasListener === false) { toast('You\'re a listener now.'); }
    // End-party button visibility follows role: hosts see it, everyone
    // else doesn't. (Old code had a `iAmHost && myRole !== 'host'`
    // conjunction that was self-contradictory and never fired.)
    $('pEndBtn').classList.toggle('hidden', myRole !== 'host');
    paintQuota();
    paintRaiseBtn();
  }

  // Reflect my hand state from server so it survives refresh.
  if (me) myHandUp = !!me.handRaised;
  paintRaiseBtn();

  // Host queue — anyone with hand raised, sorted by when they raised.
  if (iAmHost) {
    const hands = room.members.filter(m => m.handRaised && m.role === 'listener')
      .sort((a, b) => (a.handAt || 0) - (b.handAt || 0));
    const q = $('pQueue');
    if (hands.length) {
      q.classList.remove('hidden');
      q.innerHTML = '<div class="hqhdr">✋ ' + hands.length + ' asking to speak</div>' +
        hands.map(h => {
          const av = h.photo ? '<img src="' + esc(h.photo) + '" alt="">' : esc((h.name || '?').charAt(0).toUpperCase());
          return '<div class="hqrow"><span class="hqav">' + av + '</span>' +
            '<span class="hqnm">' + esc(h.name) + '</span>' +
            '<div class="hqbtns">' +
              '<button class="hqbtn" onclick="promoteMember(\'' + esc(h.id) + '\', \'speaker\')">Approve</button>' +
              '<button class="hqbtn deny" onclick="denyHand(\'' + esc(h.id) + '\')">Not now</button>' +
            '</div></div>';
        }).join('');
    } else q.classList.add('hidden');
  } else {
    $('pQueue').classList.add('hidden');
  }
}
function memberCard(m, isSpeakerPanel, iAmHost, myMicOn){
  const isMe = m.id === myId;
  const isHost = m.role === 'host';
  const cls = ['pav'];
  if (isHost) cls.push('host');
  else if (m.role === 'speaker') cls.push('speaker');
  if (isMe) cls.push('me');
  if (isMe && myMicOn) cls.push('live');
  // Avatar is no longer a mic toggle (owner ask 15 Aug 2026) — mic
  // lives on the dedicated .micbtn. Keep the .live pulse for visual
  // reassurance but do NOT add a click affordance to my own avatar.
  if (iAmHost && !isMe && !(isHost && m.uid === room.hostUid)) cls.push('canManage');
  if (selectedMemberId === m.id && iAmHost) cls.push('selected');
  if (m.handRaised && !isSpeakerPanel) cls.push('hand');
  if (SPEAKING.has(m.id)) cls.push('speaking');

  const av = m.photo
    ? '<img src="' + esc(m.photo) + '" alt="">'
    : esc((m.name || '?').charAt(0).toUpperCase());
  const roleLbl = isHost ? (isMe ? 'You · Host' : 'Host')
    : m.role === 'speaker' ? (isMe ? 'You · Speaker' : 'Speaker')
    : (isMe ? 'You' : 'Listener');
  const roleCls = isHost ? ' host' : '';
  // Mic mute/unmute chip on EVERY speaker card. My own state comes from
   // wsVoice.micOn; remote members' state is derived from whether they've
   // published any tracks (their m.tracks length). If they published a
   // track and it's currently sending audio the tray also shows on.
   // Remote mic state: prefer the explicit m.micOn flag (fires the moment
   // the peer taps unmute, before their Cloudflare publish round-trip) with
   // a fallback to tracks.length so we still flip even if the v-mic event
   // was dropped or the peer's an older client. Owner bug 2026-08-14:
   // 'I speak, mic is on for me but others can't see my mic is on'.
   let micLive = false;
   // For MY row: local wsVoice is authoritative if I'm publishing here,
   // but ALSO honour the server's m.micOn / m.tracks — because another
   // session of me (a second tab / another device with the same account)
   // may be the one holding the mic open. Owner bug 2026-08-14 two-tab:
   // Tab B opens the party, sees itself as muted even though Tab A is
   // still actively publishing. Aggregate to the truth on the server.
   if (isMe) micLive = !!myMicOn || !!m.micOn || !!(m.tracks && m.tracks.length);
   else if (isSpeakerPanel) micLive = !!m.micOn || !!(m.tracks && m.tracks.length);
   // WhatsApp-style mic glyph: clean mic when live, mic-with-slash when
   // muted. Inline SVG so we can style stroke/fill without emoji colour.
   const MIC_ON_SVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';
   const MIC_OFF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M4 4l16 16"/></svg>';
   const micChip = isSpeakerPanel ? `<span class="micchip ${micLive ? 'on' : ''}">${micLive ? MIC_ON_SVG : MIC_OFF_SVG}</span>` : '';
   // Connection-quality chip (bottom-left of avatar). Only rendered when
   // the speaker's outbound bucket is 'weak' or 'bad'. My own row uses
   // MY_QUALITY as the source of truth (instant feedback, no server
   // round-trip); everyone else reads m.quality from the last state.
   // WhatsApp-style signal-bars glyph: 4 rising bars.
   const SIGNAL_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="3"  y="14" width="3" height="7" rx="1"/><rect x="8.5" y="10" width="3" height="11" rx="1"/><rect x="14" y="6"  width="3" height="15" rx="1"/><rect x="19.5" y="2"  width="3" height="19" rx="1"/></svg>';
   const qBucket = (isSpeakerPanel && (isHost || m.role === 'speaker'))
     ? (isMe ? MY_QUALITY : (m.quality || 'good'))
     : 'good';
   const qualChip = (qBucket === 'weak' || qBucket === 'bad')
     ? `<span class="qualchip ${qBucket}" title="${qBucket === 'bad' ? 'Bad connection — audio may cut out' : 'Weak connection'}">${SIGNAL_SVG}</span>`
     : '';
  // Menu buttons MUST stopPropagation so they don't bubble to the .pav's
  // own onclick — which would re-toggle the selection and undo the action.
  // (Real bug that made "Approve" seem to do nothing sometimes.)
  const hostMenu = iAmHost && !isMe && !(isHost && m.uid === room.hostUid) ? `
    <div class="pav-menu">
      ${m.role === 'listener' ? `<button onclick="event.stopPropagation();promoteMember('${esc(m.id)}','speaker')">🎙 Make speaker</button>` : ''}
      ${m.role !== 'host'     ? `<button onclick="event.stopPropagation();promoteMember('${esc(m.id)}','host')">👑 Make co-host</button>` : ''}
      ${m.role !== 'listener' ? `<button onclick="event.stopPropagation();demoteMember('${esc(m.id)}')">↓ Move to listeners</button>` : ''}
      <button class="danger" onclick="event.stopPropagation();kickMember('${esc(m.id)}')">Remove from party</button>
    </div>` : '';

  // Avatar-tap semantics (owner ask 15 Aug 2026):
  //   • My own avatar → NO click handler (mic lives on .micbtn).
  //   • Host viewing someone else's avatar → open the host menu
  //     (promote / demote / kick) — unchanged.
  //   • Everyone else → no click handler; the avatar is a display only.
  const onclick = (iAmHost && !isMe && !(isHost && m.uid === room.hostUid))
    ? `onclick="event.stopPropagation();selectMember('${esc(m.id)}')"`
    : '';

  return `<div class="${cls.join(' ')}" data-id="${esc(m.id)}" ${onclick}>
    <div class="circ">${av}</div>
    ${micChip}
    ${qualChip}
    <div class="nm">${esc(m.name)}</div>
    ${isSpeakerPanel ? `<div class="rl${roleCls}">${roleLbl}</div>` : ''}
    ${hostMenu}
  </div>`;
}

function selectMember(id){ selectedMemberId = selectedMemberId === id ? null : id; paint(); }
document.addEventListener('click', ev => {
  // Click outside an avatar tile clears the selection so the host menu
  // pops shut cleanly. IMPORTANT: the pav-menu is a CHILD of .pav so
  // .closest('.pav') covers menu clicks too — no separate check needed.
  // Before this comment the selector was fine but the menu buttons
  // themselves had an event.stopPropagation() dependency; keeping it
  // explicit here so a future edit doesn't remove the pav wrapper.
  if (!ev.target.closest('.pav')) { selectedMemberId = null; paint(); }
});

function paintQuota(){
  const q = $('pQuota');
  const inp = $('pInput');
  if (myRole === 'host' || myRole === 'speaker') {
    q.innerHTML = '<span class="pq-strong">Unlimited chat</span> · you\'re a speaker';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else if (msgsLeft > 0) {
    q.innerHTML = 'Listener chat · <span class="pq-strong">' + msgsLeft + ' message' + (msgsLeft === 1 ? '' : 's') + ' left</span>';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else {
    q.innerHTML = '<span class="pq-none">You\'ve used both your messages.</span> Tap ✋ to ask to speak — reactions still work.';
    inp.disabled = true;
    inp.placeholder = 'Chat limit reached';
  }
}
const _seenMsgs = new Set();
function addMsg(m){
  if (!m || !m.id) return;
  if (_seenMsgs.has(m.id)) return;       // de-dupe seed vs socket events
  _seenMsgs.add(m.id);
  const el = document.createElement('div');
  el.className = 'pmsg' + (m.f === myId ? ' mine' : '');
  el.dataset.id = m.id;
  const roleCls = m.r === 'host' ? ' host' : '';
  el.innerHTML = '<span class="pmwho' + roleCls + '">' + esc(m.n) + '</span>' + esc(m.x);
  $('pMsgs').appendChild(el);
  $('pMsgs').scrollTop = $('pMsgs').scrollHeight;
}

// Host actions
function promoteMember(id, role){ socket && socket.emit('promote', { id, role }); selectedMemberId = null; }
function demoteMember(id){ socket && socket.emit('demote', { id }); selectedMemberId = null; }
function kickMember(id){ if (confirm('Remove this person from the party?')) socket && socket.emit('kick', { id }); selectedMemberId = null; }
function denyHand(id){
  // Tell the server to clear their raised-hand flag; broadcast repaints
  // everyone. Local flag-toggle here is optimistic so the queue clears
  // instantly even before the state event round-trips.
  if (socket) socket.emit('denyHand', { id });
  const m = room.members.find(x => x.id === id); if (m) m.handRaised = false;
  paint();
}
function endParty(){ if (confirm('End the party for everyone?')) socket && socket.emit('closeParty'); }

// Called by the shell's ✕ (posts 'party:leave'). If I'm the host it
// actually ends the party for everyone; otherwise I just leave. Owner
// ask 10 Aug 2026 — the ✕ said 'End for everyone' but was only calling
// leave, so the host would silently leave and the room lived on.
function leaveOrEnd(){
  if (myRole === 'host') {
    try { socket && socket.emit('closeParty'); } catch(e){}
    setTimeout(leaveAndGo, 120);
  } else {
    leaveAndGo();
  }
}

function leaveAndGo(){
  try { socket && socket.emit('leave'); } catch(e){}
  releaseWakeLock();   // let the phone screen dim again once we're out
  clearPartySession();
  if (EMBED) { postToParent({ type: 'party:left' }); return; }
  location.href = '/social';
}
// Belt-and-braces: release the wake lock on any exit path (host closed
// the party, kicked, tab close, back button). Silent no-op if not held.
window.addEventListener('pagehide', releaseWakeLock);
window.addEventListener('beforeunload', releaseWakeLock);

// Session bridge for the community app's mini-bar. Whenever we're in a
// party we write to localStorage; when the user opens /social they see
// a persistent "🎤 In party — tap to rejoin" bar. Cleared on leave/close.
function markPartySession(){
  try {
    localStorage.setItem('wsActiveParty', JSON.stringify({
      code: CODE,
      title: (room && room.title) || 'Party',
      role: myRole,
      at: Date.now()
    }));
  } catch(e){}
}
function clearPartySession(){ try { localStorage.removeItem('wsActiveParty'); } catch(e){} }

// beforeunload: warn if the user tries to close the tab / navigate away
// while in a party. Skipped when we're an embed — the parent /social
// document owns the unload dialog and we don't want two prompts.
window.addEventListener('beforeunload', (ev) => {
  if (EMBED) return;
  if (!socket || !myId) return;
  ev.preventDefault(); ev.returnValue = ''; return '';
});

let toastT = null;
function toast(msg){
  const el = $('pToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

// Manual audio recovery — wired to the header 🔄 Reconnect button.
// Calls wsVoice.reconnectAudio() which force-republishes (if speaker)
// and force-resubscribes to every peer's tracks. Safe to spam.
async function reconnectPartyAudio(){
  const btn = document.getElementById('pReconnectBtn');
  if (btn) btn.classList.add('spinning');
  toast('🔄 Reconnecting audio…');
  try {
    if (window.wsVoice && wsVoice.reconnectAudio) {
      await wsVoice.reconnectAudio();
      toast('✓ Audio reconnected — try speaking now');
    } else {
      toast("Audio's not ready yet — wait a sec and try again");
    }
  } catch (e) {
    toast('Reconnect failed — leave and rejoin the party');
  } finally {
    if (btn) setTimeout(() => btn.classList.remove('spinning'), 400);
  }
}
</script>
<!-- No shared brand strip on the party page — owner: "remove the tab
     header". Audio rooms are their own immersive surface. -->
<script>document.documentElement.setAttribute('data-nochrome','1');</script>
