<!doctype html>
<html lang="en">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JTH809Z8NH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JTH809Z8NH');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Party · WordSpies</title>
<meta name="description" content="Drop into a WordSpies party — live audio with speakers, listeners, reactions and rationed chat.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#202124; --sub:#5f6368; --faint:#80868b; --line:#e8eaed;
  --bg:#ffffff; --panel:#f8f9fa; --hover:#f1f3f4;
  --accent:#5a7bff; --accent2:#7c5cff;
  --host:#f5b52e; --host-ink:#7a5b06;
  --green:#22c07a; --err:#d93025;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:840px;margin:0 auto;padding:0 20px 0;height:100dvh;display:flex;flex-direction:column}
/* Mobile: the members area scrolls INTERNALLY. Page itself never
   scrolls — the chat panel + FABs stay pinned. */
#pMain{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 calc(200px + env(safe-area-inset-bottom))}

/* ══ Desktop pro layout (≥1000px) ══
   Two columns: left = speakers/listeners; right = chat rail. Fixed
   viewport height so the chat has its own scroll and the members panel
   doesn't fight for space. Chat composer is anchored at the bottom of
   its column instead of the whole viewport. */
@media(min-width:1000px){
  body{overflow:hidden;height:100vh}
  .wrap{max-width:1200px;padding:0 20px 0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto 1fr;grid-template-areas:'head head' 'main chat';gap:0 24px;height:100vh}
  .phead{grid-area:head}
  #pMain{grid-area:main;padding-bottom:0;overflow-y:auto;padding-right:6px}
  .pchat{position:relative;grid-area:chat;bottom:auto;left:auto;right:auto;border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:16px;display:flex;flex-direction:column;min-height:0}
  .pchat .pmsgs{max-height:none;flex:1;margin:0 0 8px;padding:8px 4px}
  .pchat .pcompose{padding-top:6px;border-top:1px solid var(--line);padding:12px 0 0}
  .pchat.hidden{display:none}
  /* Floating action pills stay pinned to the members column instead of
     centre-of-screen so they don't overlap the chat rail. */
  .micfab,.handfab{left:auto;right:calc(380px + 44px);transform:none;bottom:32px}
  .micfab:hover,.handfab:hover{transform:translateY(-1px)}
  .micfab:active,.handfab:active{transform:scale(.97)}
  /* Speakers get bigger avatars on wide screens — the party FEELS like
     a room instead of a mobile list. */
  .speakers{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
  .speakers .pav .circ{width:72px;height:72px;font-size:28px}
  .speakers .pav .nm{font-size:14px}
  .listeners{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .listeners .pav .circ{width:48px;height:48px;font-size:19px}
  /* Keyboard-shortcut hint under the mic pill */
  .kbdhint{grid-area:main;position:absolute;bottom:16px;left:26px;font-size:11px;font-weight:600;color:var(--faint);background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center;pointer-events:none}
  .kbdhint kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:700;color:var(--ink)}
}
@media(max-width:999px){ .kbdhint{display:none} }
.hidden{display:none !important}

/* Party header — title + subtitle on the left, End (host only) right. */
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 4px 8px;flex-shrink:0}
.phead-txt{min-width:0;flex:1}
.phead-txt h1{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:19px;color:var(--ink);letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead-txt p{font-size:12.5px;color:var(--faint);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pheadEnd{background:#fff5f5;color:var(--err);border:1px solid #f8d3d3;border-radius:99px;padding:8px 14px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:13px;cursor:pointer;flex-shrink:0;transition:background .12s,transform .1s}
.pheadEnd:hover{background:#ffe4e4}
.pheadEnd:active{transform:scale(.95)}

/* Centred emoji picker — floats over everything, backdrop dims. */
.emopop{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(20,22,28,.45);animation:emofade .15s ease-out}
.emopop.show{display:flex}
.emopop .emopop-card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:min(320px,90vw)}
.emopop .emopop-card button{background:transparent;border:0;font-size:32px;padding:12px 6px;border-radius:14px;cursor:pointer;line-height:1;transition:background .12s,transform .06s}
.emopop .emopop-card button:hover{background:var(--hover)}
.emopop .emopop-card button:active{transform:scale(.9)}
@keyframes emofade{from{opacity:0}to{opacity:1}}

/* Emoji burst centred over a member's avatar. Shows one at a time per
   member — a new emoji replaces the old one. */
.pav .pav-emo{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:64px;height:64px;display:flex;align-items:center;justify-content:center;font-size:44px;pointer-events:none;animation:pavEmoPop .9s cubic-bezier(.34,1.56,.64,1) forwards;z-index:9;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
@keyframes pavEmoPop{
  0%{transform:translateX(-50%) scale(.2);opacity:0}
  20%{transform:translateX(-50%) scale(1.25);opacity:1}
  70%{transform:translateX(-50%) scale(1);opacity:1}
  100%{transform:translateX(-50%) scale(1);opacity:0}
}
.listeners .pav .pav-emo{font-size:32px;top:8px;width:44px;height:44px}

/* Compact floating actions in the top-right (replaces the old header). */
.ptop{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:40;display:flex;gap:6px;align-items:center}
.ptopbtn{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:8px 12px;min-width:38px;height:38px;font-size:14px;font-weight:700;cursor:pointer;transition:background .12s,color .12s,transform .1s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ptopbtn:hover{background:var(--hover)}
.ptopbtn:active{transform:scale(.94)}
/* Tiny icon-only variant for the Invite button. */
.ptopbtn.small{padding:0;width:32px;height:32px;min-width:32px;font-size:13px}
.ptopbtn.danger{background:#fff5f5;color:var(--err);border-color:#f8d3d3;padding:8px 14px}
.ptopbtn.danger:hover{background:#ffe4e4}
.ptopbtn .pei{font-size:14px;line-height:1}
/* On mobile the wrap has no top padding — first section sits at 8px.
   Nudge it down so the section header clears the floating actions. */
.psect:first-of-type{margin-top:14px}
@keyframes plive{0%,100%{opacity:.4;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

/* Section headers */
.psect{margin-bottom:26px}
.psect .ph{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.psect .ph h3{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;color:var(--ink);letter-spacing:-.1px}
.psect .ph h3 b{color:var(--faint);font-weight:600;font-size:13px;margin-left:6px}
.psect .ph .phelp{font-size:11.5px;color:var(--faint);font-weight:600}

/* Speaker + listener grids — tighter gap so avatars sit close, more
   like a real "room" than a wide-spaced tile grid. */
.speakers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px}
.listeners{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px}

/* Avatar tile — clean, borderless. Optional coloured ring for host / live. */
.pav{position:relative;text-align:center;padding:8px 2px;border-radius:14px;transition:background .12s;cursor:default}
.pav.tapMe{cursor:pointer}
.pav.tapMe:active{background:var(--hover)}
.pav .circ{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;background:#5a7bff;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:24px;overflow:hidden;position:relative}
.pav .circ img{width:100%;height:100%;object-fit:cover;display:block}
/* Speakers all share the SAME green ring — owner asked: no more
   gold vs blue distinction. Host is still marked by a small crown chip
   below, but the ring is one colour everyone recognises as "speaker".*/
.pav.host .circ,.pav.speaker .circ{outline:3px solid var(--green);outline-offset:2px;background:linear-gradient(135deg,#5a7bff,#7c5cff)}
.pav.host .circ{background:linear-gradient(135deg,#22c07a,#159f5d)}
/* Live-mic pulse: still green, just a brighter outer glow */
.pav.live .circ::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--green);animation:plive 1.2s ease-out infinite}
/* Mic mute/unmute badge — a cute circular chip sitting bottom-right of
   the avatar. Shows for EVERY speaker (host + speaker), driven by their
   live mic state. Owner ask: "make the cute mic icon on the profile
   icon mute unmute display". */
.pav .micchip{position:absolute;bottom:30px;right:calc(50% - 32px);background:#d93025;color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:background .12s}
.pav .micchip.on{background:var(--green)}
/* Small crown chip so the host is still distinguishable from a speaker
   without breaking the unified colour rule. */
.pav.host::before{content:'👑';position:absolute;top:-2px;right:calc(50% - 32px);font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
/* Little tap-to-talk hint over my own avatar */
.pav.tapMe .circ::before{content:'Tap to talk';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.pav.tapMe:hover .circ::before{opacity:.9}
.pav.tapMe.live .circ::before{content:'Tap to mute';background:var(--green)}
.pav .nm{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
/* Role sublabel retired — the crown chip already signals host and the
   avatar-column position tells you speaker vs listener. */
.pav .rl{display:none}

.listeners .pav{padding:6px 2px}
.listeners .pav .circ{width:44px;height:44px;font-size:17px;margin-bottom:6px}
.listeners .pav .nm{font-size:11px}
.listeners .pav .rl{display:none}
.listeners .pav .micchip{display:none}
/* Listener with hand raised */
.pav.hand::before{content:'✋';position:absolute;top:0;right:6px;font-size:14px;background:#fff8e6;padding:3px 5px;border-radius:99px;border:1px solid #f0d97a;animation:handwave 1.3s ease-in-out infinite}
@keyframes handwave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}

/* Contextual actions row — appears below a speaker/listener when host taps */
.pav.selected{background:var(--hover)}
.pav-menu{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;display:none;flex-direction:column;gap:2px;z-index:10;min-width:130px}
.pav.selected .pav-menu{display:flex}
.pav-menu button{background:transparent;color:var(--ink);border:0;padding:8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;border-radius:6px;text-align:left;cursor:pointer;white-space:nowrap}
.pav-menu button:hover{background:var(--hover)}
.pav-menu button.danger{color:var(--err)}

/* Raise-hand queue for hosts */
.hostqueue{background:#fff8e6;border:1px solid #f0d97a;border-radius:14px;padding:12px 14px;margin-bottom:22px}
.hostqueue .hqhdr{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--host-ink);margin-bottom:10px}
.hostqueue .hqrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid #f0d97a}
.hostqueue .hqrow:first-of-type{border-top:0}
.hostqueue .hqav{width:32px;height:32px;border-radius:50%;background:#f5b52e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden}
.hostqueue .hqav img{width:100%;height:100%;object-fit:cover}
.hostqueue .hqnm{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
.hostqueue .hqbtns{display:flex;gap:6px;flex-shrink:0}
.hostqueue .hqbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:12px;cursor:pointer}
.hostqueue .hqbtn.deny{background:#fff;color:var(--sub);border:1px solid var(--line)}

/* Floating action pills above the chat panel — always visible, impossible
   to miss. Two variants: mic (speakers), raise-hand (listeners). Only
   ONE ever shows at a time based on the user's role. */
/* Tandem-style mic pill: big, soft, rounded. Off = white with dark
   text, mic in a soft grey chip. On = full green with subtle glow. */
.micfab,.handfab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(148px + env(safe-area-inset-bottom));z-index:35;display:none;align-items:center;gap:12px;border:1px solid var(--line);border-radius:99px;padding:12px 22px 12px 12px;font-family:'Fredoka','Nunito',system-ui,sans-serif;font-weight:600;font-size:15px;cursor:pointer;transition:transform .12s,background .18s,box-shadow .18s,color .18s;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.micfab.show,.handfab.show{display:inline-flex}
.micfab{background:#fff;color:var(--ink)}
.micfab .mfico{width:38px;height:38px;border-radius:50%;background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:18px;transition:background .18s,color .18s}
.micfab.on{background:linear-gradient(135deg,#22c07a,#159f5d);color:#fff;border-color:transparent;box-shadow:0 10px 26px rgba(34,192,122,.35),0 0 0 6px rgba(34,192,122,.12);animation:tandemBreathe 2.2s ease-in-out infinite}
.micfab.on .mfico{background:rgba(255,255,255,.22);color:#fff}
.micfab:hover,.handfab:hover{transform:translateX(-50%) translateY(-2px)}
.micfab:active,.handfab:active{transform:translateX(-50%) scale(.97)}
@keyframes tandemBreathe{0%,100%{box-shadow:0 10px 26px rgba(34,192,122,.35),0 0 0 6px rgba(34,192,122,.12)}50%{box-shadow:0 10px 26px rgba(34,192,122,.45),0 0 0 12px rgba(34,192,122,.08)}}
/* Raise-hand: red pill so it screams "ask to speak" — owner's ask. */
.handfab{background:#d93025;box-shadow:0 6px 18px rgba(217,48,37,.32)}
.handfab.up{background:#a52618;box-shadow:0 6px 18px rgba(165,38,24,.4)}
.handfab .hfico{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
@media(max-width:480px){
  .micfab,.handfab{bottom:calc(150px + env(safe-area-inset-bottom));padding:10px 18px 10px 12px;font-size:14px}
  .micfab .mfico,.handfab .hfico{width:28px;height:28px;font-size:14px}
}

/* Bottom chat panel — soft top-fade + generous padding. */
.pchat{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:30}
.pchat::before{content:'';position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0));pointer-events:none}
.pmsgs{max-width:640px;margin:0 auto 8px;max-height:200px;overflow-y:auto;padding:4px 6px;display:flex;flex-direction:column;gap:7px;scrollbar-width:thin}
.pmsg{background:var(--panel);border-radius:16px;padding:8px 12px;font-size:13.5px;line-height:1.45;word-break:break-word;color:var(--ink);max-width:82%;align-self:flex-start}
.pmsg .pmwho{font-weight:800;font-size:11px;color:var(--accent);margin-right:6px}
.pmsg .pmwho.host{color:var(--host-ink)}
.pmsg.mine{background:linear-gradient(135deg,#5a7bff,#7c5cff);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.pmsg.mine .pmwho{color:rgba(255,255,255,.85)}
.pmsg:not(.mine){border-bottom-left-radius:6px}

.pcompose{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:center}
.pcompose .pinput{flex:1;background:var(--panel);border:1px solid transparent;color:var(--ink);font-family:inherit;font-size:14.5px;padding:11px 16px;border-radius:99px;outline:none;min-width:0;transition:border-color .12s,background .12s,box-shadow .12s}
.pcompose .pinput:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(90,123,255,.12)}
.pcompose .pinput:disabled{opacity:.55}
.pcompose .pbtn{background:var(--accent);color:#fff;border:0;width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .12s,transform .1s}
.pcompose .pbtn:hover{background:#4a68e0}
.pcompose .pbtn:active{transform:scale(.94)}
.pcompose .pbtn:disabled{opacity:.45;cursor:default}
.pcompose .pemo{background:var(--panel);color:var(--ink);border:0;width:40px;height:40px;border-radius:50%;font-size:17px;cursor:pointer;flex-shrink:0;transition:background .12s}
.pcompose .pemo:hover{background:var(--hover)}
/* raise-hand button that replaces the mic slot for listeners */
.pcompose .praise{display:none}   /* replaced by the big FAB below */
.pquota{max-width:640px;margin:0 auto 5px;text-align:center;font-size:11.5px;color:var(--sub);font-weight:600}
.pquota .pq-strong{color:var(--ink)}
.pquota .pq-none{color:var(--err)}

/* Emoji burst dock */
.pemoji-pick{max-width:640px;margin:0 auto 6px;display:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;gap:2px}
.pemoji-pick.show{display:flex;flex-wrap:wrap;justify-content:center}
.pemoji-pick button{background:transparent;color:var(--ink);border:0;font-size:22px;padding:6px 10px;border-radius:8px;cursor:pointer}
.pemoji-pick button:hover{background:var(--hover)}

/* Header action buttons */
.pinvite{background:#eef1ff;color:#4358d1;border:1px solid #d0d7ff;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:8px;transition:background .12s}
.pinvite:hover{background:#dee4ff}
.pinvite.done{background:#e8f9ef;color:#159f5d;border-color:#c1e6d1}
.pleave{background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:8px;transition:background .12s}
.pleave:hover{background:var(--hover);color:var(--ink)}
.pend{background:#fff5f5;color:var(--err);border:1px solid #f8d3d3;border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:6px;transition:background .12s}
.pend:hover{background:#ffe4e4}

/* Speaking ring — pulses on the avatar of whoever is actively talking
   right now. Sits on top of the existing gold/blue role rings. */
.pav.speaking .circ{box-shadow:0 0 0 3px var(--green),0 0 0 8px rgba(34,192,122,.28);animation:speakpulse 1.1s ease-in-out infinite}
@keyframes speakpulse{0%,100%{box-shadow:0 0 0 3px var(--green),0 0 0 8px rgba(34,192,122,.20)}50%{box-shadow:0 0 0 3px var(--green),0 0 0 14px rgba(34,192,122,.10)}}

/* Compact mute + reactions pair, bottom-right of the viewport. Two
   round icon buttons instead of the big pill for people who want
   less UI. The reactions menu pops upward when tapped. */
.quickact{position:fixed;right:16px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:36;display:none;flex-direction:column;gap:8px;align-items:flex-end}
.quickact.show{display:flex}
.quickact .qmute,.quickact .qrx,.quickact .qinv,.quickact .qend{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.10);transition:transform .12s,background .12s,color .12s;display:flex;align-items:center;justify-content:center}
.quickact .qmute:hover,.quickact .qrx:hover,.quickact .qinv:hover,.quickact .qend:hover{transform:translateY(-2px)}
.quickact .qmute.on{background:linear-gradient(135deg,#22c07a,#159f5d);color:#fff;border-color:transparent;animation:speakpulse 1.4s ease-in-out infinite}
.quickact .qend{background:#fff5f5;color:var(--err);border-color:#f8d3d3}
.quickact .qinv.done{background:#e8f9ef;color:#159f5d;border-color:#c1e6d1}
.quickact .qrxmenu{display:none;position:absolute;bottom:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.15);width:230px}
.quickact .qrxmenu.show{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.quickact .qrxmenu button{background:transparent;border:0;font-size:22px;padding:6px 4px;border-radius:8px;cursor:pointer;line-height:1;transition:background .12s,transform .06s}
.quickact .qrxmenu button:hover{background:var(--hover);transform:scale(1.15)}
@media(max-width:640px){ .quickact{right:12px;bottom:calc(148px + env(safe-area-inset-bottom))} }
@media(min-width:1000px){ .quickact{bottom:96px} }

/* Toasts */
.ptoast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;pointer-events:none;opacity:0;transition:.2s}
.ptoast.show{opacity:1;top:24px}
</style>
</head>
<body>

<div class="wrap">
  <!-- Party header: title + subtitle on the left, End (host only) on
       the right. Section labels/counts stay stripped — the avatar
       grids speak for themselves. Counts kept as hidden shells so
       paint() can still write into them. -->
  <header class="phead" id="pHead">
    <div class="phead-txt">
      <h1 id="pTitle"></h1>
      <p id="pSub"></p>
    </div>
    <button class="pheadEnd hidden" id="pEndBtn" onclick="endParty()" title="End party for everyone">End 🎉</button>
  </header>

  <main id="pMain">
    <!-- Raise-hand queue — only rendered for hosts. -->
    <div class="hostqueue hidden" id="pQueue"></div>

    <div class="psect">
      <div class="ph"><h3>Speakers <b id="speakerCnt">0</b></h3><span class="phelp">Tap your avatar to talk</span></div>
      <div class="speakers" id="speakers"></div>
    </div>
    <div class="psect">
      <div class="ph"><h3>Listeners <b id="listenerCnt">0</b></h3></div>
      <div class="listeners" id="listeners"></div>
    </div>
  </main>
</div>

<!-- Compact quick actions: mute + reactions. Small round buttons for
     users who don't want the big FAB in their face. Owner asked for
     "two small icons mute and reaction button that opens many reactions". -->
<div class="quickact" id="pQuickAct">
  <button class="qmute" id="qMuteBtn" onclick="toggleMyMic()" title="Mute / unmute (Speakers only)">🎤</button>
  <button class="qrx" id="qRxBtn" onclick="toggleReactionsMenu(event)" title="Send a reaction">🎉</button>
  <button class="qinv" id="pInviteBtn" onclick="copyInvite()" title="Copy invite link">🔗</button>
</div>

<!-- Centred emoji picker — replaces the bottom-right popover. Owner asked:
     picker floats mid-screen, pick ONE emoji, it displays over the sender's
     avatar. -->
<div class="emopop" id="pEmoPop" onclick="if(event.target===this)closeEmoPop()">
  <div class="emopop-card" id="pEmoCard">
    <button data-e="❤️">❤️</button><button data-e="😂">😂</button><button data-e="🔥">🔥</button><button data-e="👏">👏</button>
    <button data-e="😮">😮</button><button data-e="🎉">🎉</button><button data-e="💯">💯</button><button data-e="🙌">🙌</button>
    <button data-e="👍">👍</button><button data-e="🤔">🤔</button><button data-e="😢">😢</button><button data-e="✨">✨</button>
  </div>
</div>

<!-- Big always-visible action pills above the chat bar. Only one shows
     at a time depending on my role. -->
<button class="micfab" id="pMicFab" onclick="toggleMyMic()">
  <span class="mfico">🎤</span>
  <span id="pMicFabLbl">Tap to talk</span>
</button>
<button class="handfab" id="pHandFab" onclick="toggleHand()">
  <span class="hfico">✋</span>
  <span id="pHandFabLbl">Raise hand to speak</span>
</button>

<!-- Keyboard shortcut hint (desktop only) -->
<div class="kbdhint" id="kbdHint"><kbd>Space</kbd> hold to talk · <kbd>Esc</kbd> minimise</div>

<!-- Fixed chat panel at the bottom -->
<div class="pchat hidden" id="pChat">
  <div class="pquota" id="pQuota"></div>
  <div class="pmsgs" id="pMsgs"></div>
  <div class="pemoji-pick" id="pEmojiPick">
    <button data-e="❤️">❤️</button><button data-e="😂">😂</button><button data-e="🔥">🔥</button>
    <button data-e="👏">👏</button><button data-e="😮">😮</button><button data-e="🎉">🎉</button>
    <button data-e="💯">💯</button><button data-e="🙌">🙌</button>
  </div>
  <div class="pcompose">
    <!-- Listeners see a raise-hand pill here; speakers see nothing (mic is
         on their avatar now). Slot stays reserved so layout doesn't jump. -->
    <button class="praise hidden" id="pRaiseBtn" onclick="toggleHand()" title="Ask to speak">✋</button>
    <input class="pinput" id="pInput" placeholder="Say something…" maxlength="500" autocomplete="off">
    <button class="pemo" onclick="document.getElementById('pEmojiPick').classList.toggle('show')" title="React">🎉</button>
    <button class="pbtn" id="pSendBtn" title="Send">➤</button>
  </div>
</div>

<div class="ptoast" id="pToast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/voice.js"></script>
<script src="/emoji-fly.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
let CODE = (params.get('room') || '').trim().toUpperCase();
const EMBED = params.get('embed') === '1';   // true when hosted inside /social's iframe
let socket = null, room = null, myId = null, myRole = 'listener', msgsLeft = 2, myHandUp = false, selectedMemberId = null;
let ME_UID = null;   // set from the 'joined' event; used by the host-reclaim fallback
let SPEAKING = new Set();   // socket ids currently detected as talking

// Talk to the parent /social if we're embedded — used to close the host
// iframe when the party ends, minimize on user gesture, etc.
function postToParent(msg){
  if (!EMBED) return;
  try { parent.postMessage(msg, location.origin); } catch(e){}
}
if (EMBED) {
  // Hide the standalone back button — the parent owns navigation now.
  document.addEventListener('DOMContentLoaded', () => {
    const back = document.querySelector('.pback'); if (back) back.style.display = 'none';
    // Parent listens for a leave request from inside.
    window.addEventListener('message', (ev) => {
      if (ev.origin !== location.origin) return;
      if (ev.data && ev.data.type === 'party:leave') leaveAndGo();
    });
  });
}

// Boot: load room + open socket + auto-join. There's no separate "Join" tap
// any more — the whole point of opening /party?room=... IS to join, so we
// do that immediately.
async function boot(){
  if (!CODE) { alert('No party code in the URL.'); location.href = '/social'; return; }
  try {
    const r = await fetch('/api/parties/' + encodeURIComponent(CODE));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Party not found.');
    room = j.room;
    $('pTitle').textContent = room.title;
    // Always show a subtitle: room's own tagline if set, else the room
    // code so guests can read it off the header.
    $('pSub').textContent = room.subtitle || ('Code · ' + CODE);
  } catch(e){ alert(e.message); location.href = '/social'; return; }
  // Open the socket + auto-join.
  conn().emit('join', { code: CODE });
}

function conn(){
  if (socket) return socket;
  socket = io('/party');
  socket.on('state', st => {
    room = st;
    // Sync myRole from server truth. Without this the client stays in its
    // 'joined' role forever, so a demoted speaker keeps canPublish=true and
    // can just re-open the mic. Owner-reported: "speaker who goes to
    // listener is still able to speak." Fix both the role, the voice
    // module's canPublish flag, and hard-stop the mic on the transition.
    if (myId && room && room.members) {
      const meRow = room.members.find(m => m.id === myId);
      if (meRow && meRow.role && meRow.role !== myRole) {
        const wasSpeaker = (myRole === 'host' || myRole === 'speaker');
        myRole = meRow.role;
        const nowSpeaker = (myRole === 'host' || myRole === 'speaker');
        if (window.wsVoice) {
          // Tear the mic down BEFORE flipping canPublish — setMic still
          // has to complete the unpublish path, and we don't want the
          // guard to bounce it.
          if (wasSpeaker && !nowSpeaker) {
            try { wsVoice.setMic(false); } catch(e){}
          }
          try { wsVoice.setCanPublish(nowSpeaker); } catch(e){}
        }
        paintQuota();
        paintRaiseBtn();
      }
    }
    paint();
  });
  socket.on('joined', d => {
    myId = d.you; myRole = d.role; msgsLeft = d.msgsLeft || 0;
    ME_UID = d.uid || null;
    $('pChat').classList.remove('hidden');
    if (myRole === 'host') $('pEndBtn').classList.remove('hidden');
    paintQuota();
    paintRaiseBtn();
    // Voice — publisher if host/speaker, listener otherwise. Voice module
    // handles CF SFU vs P2P internally.
    if (window.wsVoice) {
      wsVoice.setMyId(myId);
      wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
      wsVoice.init({ socket, myId, canPublish: (myRole === 'host' || myRole === 'speaker') });
      wsVoice.on('mic', () => paint());       // avatar ring reflects mic state
      // Remote-speaker detection — audioLevel per inbound track (0..1).
      // Above 0.02 counts as "speaking"; a member gets the pulsing green
      // ring for 1.5s after their last spike so mid-sentence gaps don't
      // strobe it off.
      let clearT = {};
      wsVoice.on('levels', (levelsByTrack) => {
        // trackIdentifier maps to member via room.members[].cfSession is
        // the peer's SFU session and their tracks are stamped there; but
        // the browser's own trackIdentifier for a remote track equals the
        // CF trackName they published. Match either.
        Object.entries(levelsByTrack || {}).forEach(([tid, lvl]) => {
          if (lvl < 0.02) return;
          const owner = (room && room.members || []).find(m => (m.tracks || []).includes(tid) || m.cfSession === tid);
          const id = owner && owner.id; if (!id) return;
          SPEAKING.add(id);
          clearTimeout(clearT[id]);
          clearT[id] = setTimeout(() => { SPEAKING.delete(id); paint(); }, 1500);
        });
        paint();
      });
      // Local mic — pulse OUR own avatar without waiting for the SFU
      // round-trip. Uses an AudioContext analyser on the local stream.
      let mineClearT = null;
      wsVoice.on('local-level', (lvl) => {
        if (!myId) return;
        if (lvl > 0.06) {
          SPEAKING.add(myId);
          clearTimeout(mineClearT);
          mineClearT = setTimeout(() => { SPEAKING.delete(myId); paint(); }, 900);
          paint();
        }
      });
    }
    // Party emoji — bursts over the sender's avatar, not flying across
     // the screen. Register our own handler; skip wsEmojiFly.init() so it
     // doesn't attach the default fly-across listener.
     socket.on('emoji', d => { if (d && d.e) burstOnMember(d.from, d.e); });
    // Defensive: if the server seated me as a non-host but the room
    // was actually created by me, ask it to reclaim host. Server verifies
    // the uid so this can't be spoofed by anyone else. Slight delay so
    // the first state broadcast has time to arrive with room.hostUid.
    setTimeout(() => {
      if (!room || !socket || !socket.connected) return;
      if (myRole !== 'host' && room.hostUid && ME_UID && room.hostUid === ME_UID) {
        socket.emit('reclaimHost');
      }
    }, 800);
  });
  socket.on('chat', addMsg);
  // Host demoted me back to listener — force the mic off immediately so
  // I can't keep speaking. Server also stripped my tracks server-side.
  socket.on('force-mute', () => {
    if (window.wsVoice) { try { wsVoice.setMic(false); } catch(e){} }
    toast('You\'re a listener now — mic muted.');
  });
  socket.on('chatMeta', m => { msgsLeft = m.msgsLeft; paintQuota(); });
  socket.on('chatBlocked', d => toast(d.reason || 'Chat blocked'));
  socket.on('replaced', () => toast('You joined from another tab — this one\'s inactive.'));
  socket.on('kicked', () => {
    clearPartySession(); toast('The host removed you from the party.');
    postToParent({ type: 'party:kicked' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  socket.on('closed', () => {
    clearPartySession(); toast('The host ended this party.');
    postToParent({ type: 'party:closed' });
    if (!EMBED) setTimeout(() => location.href='/social', 1400);
  });
  socket.on('err', e => toast(e.msg || 'Something went wrong.'));
  return socket;
}
boot();

// Chat send — respects the 2-message listener limit
function send(){
  const v = $('pInput').value.trim();
  if (!v || !socket) return;
  if (myRole === 'listener' && msgsLeft <= 0) { toast('Only 2 messages for listeners — wait for the host to promote you.'); return; }
  socket.emit('chat', { text: v });
  $('pInput').value = '';
}
$('pSendBtn').onclick = send;
$('pInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// Legacy composer-emoji picker (kept in DOM, hidden by default) — the
// centered popover replaces it. Wire it up defensively in case it re-appears.
(function(){
  const legacy = document.getElementById('pEmojiPick');
  if (!legacy) return;
  legacy.querySelectorAll('button[data-e]').forEach(b => {
    b.onclick = () => { sendPartyEmoji(b.dataset.e); legacy.classList.remove('show'); };
  });
})();

// Centered emoji picker — floats over the whole viewport. Owner ask:
// "middle of the screen as float, show one, display in middle of his profile".
function openEmoPop(){
  const pop = document.getElementById('pEmoPop');
  if (pop) pop.classList.add('show');
}
function closeEmoPop(){
  const pop = document.getElementById('pEmoPop');
  if (pop) pop.classList.remove('show');
}
document.addEventListener('DOMContentLoaded', () => {
  const card = document.getElementById('pEmoCard');
  if (!card) return;
  card.querySelectorAll('button[data-e]').forEach(b => {
    b.onclick = () => { sendPartyEmoji(b.dataset.e); closeEmoPop(); };
  });
});

// Send one emoji: server broadcasts to the room; we also burst locally
// over MY own avatar so the sender sees their pick immediately.
function sendPartyEmoji(e){
  if (!socket || !e) return;
  try { socket.emit('emoji', { e }); } catch(err){}
  if (myId) burstOnMember(myId, e);
}

// Show a single emoji centered on a member's avatar. Only ONE is visible
// at a time per member — a new emoji replaces the old one.
function burstOnMember(memberId, emoji){
  if (!memberId || !emoji) return;
  const av = document.querySelector('.pav[data-id="' + CSS.escape(memberId) + '"]');
  if (!av) return;
  const prev = av.querySelector('.pav-emo');
  if (prev) prev.remove();
  const el = document.createElement('div');
  el.className = 'pav-emo';
  el.textContent = String(emoji);
  av.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 900);
}

// Raise-hand for listeners.
function toggleHand(){
  if (!socket || myRole !== 'listener') return;
  myHandUp = !myHandUp;
  socket.emit(myHandUp ? 'raiseHand' : 'lowerHand');
  paintRaiseBtn();
}
function paintRaiseBtn(){
  const btn = $('pRaiseBtn');
  if (btn) btn.classList.add('hidden');   // legacy composer pill retired
  const fab = $('pHandFab');
  const lbl = $('pHandFabLbl');
  if (!fab || !lbl) return;
  if (myRole === 'listener') {
    fab.classList.add('show');
    fab.classList.toggle('up', myHandUp);
    lbl.textContent = myHandUp ? 'Hand raised — waiting for host' : 'Raise hand to speak';
  } else {
    fab.classList.remove('show');
  }
}

// Keyboard shortcuts (desktop pro): hold Space to talk (push-to-talk),
// tap Esc to minimise back into the community app. Ignored while the
// chat input has focus so typing "hello world" doesn't blast the mic.
let pttHeld = false;
document.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'Escape') {
    e.preventDefault();
    postToParent({ type: 'party:minimize' });
    return;
  }
  if (e.code === 'Space' && !e.repeat) {
    if (!(myRole === 'host' || myRole === 'speaker')) return;
    e.preventDefault();
    // First press of a fresh chain — treat as PTT-on if mic was off.
    if (!window.wsVoice) return;
    if (!wsVoice.micOn) { pttHeld = true; toggleMyMic(); }
    else { pttHeld = false; }   // if mic already on (toggle mode) leave it alone
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space' && pttHeld) {
    pttHeld = false;
    if (window.wsVoice && wsVoice.micOn) toggleMyMic();
  }
});

// Copy the party invite link to the clipboard. Same URL that opens the
// party from anywhere — includes the room code, no auth token.
async function copyInvite(){
  const btn = $('pInviteBtn');
  const link = location.origin + '/party?room=' + encodeURIComponent(CODE);
  try {
    await navigator.clipboard.writeText(link);
    btn.classList.add('done'); btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('done'); btn.textContent = '🔗'; }, 1500);
    toast('Invite link copied — share it anywhere.');
  } catch(e){ toast(link); }
}

// Reactions button now opens the centered picker (owner: "middle of the
// screen as float"). The old popover stack was removed.
function toggleReactionsMenu(ev){
  if (ev) ev.stopPropagation();
  openEmoPop();
}

async function toggleMyMic(){
  if (!window.wsVoice) return;
  if (!(myRole === 'host' || myRole === 'speaker')) {
    toast('You\'re a listener — tap ✋ to ask the host to raise you.');
    return;
  }
  try {
    await wsVoice.setMic(!wsVoice.micOn);
    paint();
  } catch(e){ toast(e.message || 'Microphone failed.'); }
}

function paint(){
  if (!room) return;
  $('pTitle').textContent = room.title;
  $('pSub').textContent = room.subtitle || '';
  // Refresh the community-app rejoin bridge each state tick.
  markPartySession();
  // Keep the iframe host's title synced with the party's live title.
  postToParent({ type: 'party:title', title: room.title });
  const iAmHost = myRole === 'host';
  const iAmSpeaker = iAmHost || myRole === 'speaker';
  const micOn = window.wsVoice && wsVoice.micOn;

  // Big always-visible mic pill: shown to hosts and speakers only, label
  // + colour reflect whether the mic is live.
  const fab = $('pMicFab'), fabLbl = $('pMicFabLbl');
  if (fab && fabLbl) {
    fab.classList.toggle('show', iAmSpeaker);
    fab.classList.toggle('on', !!micOn);
    fabLbl.textContent = micOn ? 'Live' : 'Tap to talk';
  }
  // Compact quick actions: same visibility as the FAB (speakers only for
  // mute), but everyone gets the reaction button.
  const q = $('pQuickAct');
  if (q) {
    q.classList.add('show');
    $('qMuteBtn').style.display = iAmSpeaker ? '' : 'none';
    $('qMuteBtn').classList.toggle('on', !!micOn);
    $('qMuteBtn').textContent = micOn ? '🎤' : '🔇';
    $('qMuteBtn').title = micOn ? 'Mute' : 'Unmute (Speakers only)';
  }

  const speakers = room.members.filter(m => m.role === 'host' || m.role === 'speaker');
  const listeners = room.members.filter(m => m.role === 'listener');
  $('speakerCnt').textContent = speakers.length;
  $('listenerCnt').textContent = listeners.length;
  $('speakers').innerHTML = speakers.map(m => memberCard(m, true, iAmHost, micOn)).join('');
  $('listeners').innerHTML = listeners.map(m => memberCard(m, false, iAmHost, micOn)).join('');

  // Chat rail: NEVER rebuild from state. Old code wiped the list on
   // every count change and it wrecked scroll + flashed messages away
   // while they were being read. Now we do it once (first paint) and
   // rely on the socket 'chat' event to append new ones. If we ever
   // reload a fresh room, `_msgsInit` is false → seed once.
   if (!room._msgsInit) {
     $('pMsgs').innerHTML = '';
     (room.messages || []).forEach(addMsg);
     room._msgsInit = true;
   }

  // Detect role change (promoted / demoted) and react.
  const me = room.members.find(m => m.id === myId);
  if (me && me.role !== myRole) {
    const wasListener = myRole === 'listener';
    const wasSpeaker = myRole === 'host' || myRole === 'speaker';
    myRole = me.role;
    if (window.wsVoice) wsVoice.setCanPublish(myRole === 'host' || myRole === 'speaker');
    // If I got demoted to listener, force my mic off even if the server's
    // force-mute event races. Belt-and-braces so a listener can NEVER
    // still be broadcasting.
    if (myRole === 'listener' && wasSpeaker && window.wsVoice && wsVoice.micOn) {
      try { wsVoice.setMic(false); } catch(e){}
    }
    if (myRole === 'host') { msgsLeft = 999; toast('You\'re now a co-host! Full mic + unlimited chat.'); myHandUp = false; }
    else if (myRole === 'speaker') { msgsLeft = 999; toast('You\'re a speaker! Tap your avatar to talk.'); myHandUp = false; }
    else if (wasListener === false) { toast('You\'re a listener now.'); }
    // End-party button visibility follows role: hosts see it, everyone
    // else doesn't. (Old code had a `iAmHost && myRole !== 'host'`
    // conjunction that was self-contradictory and never fired.)
    $('pEndBtn').classList.toggle('hidden', myRole !== 'host');
    paintQuota();
    paintRaiseBtn();
  }

  // Reflect my hand state from server so it survives refresh.
  if (me) myHandUp = !!me.handRaised;
  paintRaiseBtn();

  // Host queue — anyone with hand raised, sorted by when they raised.
  if (iAmHost) {
    const hands = room.members.filter(m => m.handRaised && m.role === 'listener')
      .sort((a, b) => (a.handAt || 0) - (b.handAt || 0));
    const q = $('pQueue');
    if (hands.length) {
      q.classList.remove('hidden');
      q.innerHTML = '<div class="hqhdr">✋ ' + hands.length + ' asking to speak</div>' +
        hands.map(h => {
          const av = h.photo ? '<img src="' + esc(h.photo) + '" alt="">' : esc((h.name || '?').charAt(0).toUpperCase());
          return '<div class="hqrow"><span class="hqav">' + av + '</span>' +
            '<span class="hqnm">' + esc(h.name) + '</span>' +
            '<div class="hqbtns">' +
              '<button class="hqbtn" onclick="promoteMember(\'' + esc(h.id) + '\', \'speaker\')">Approve</button>' +
              '<button class="hqbtn deny" onclick="denyHand(\'' + esc(h.id) + '\')">Not now</button>' +
            '</div></div>';
        }).join('');
    } else q.classList.add('hidden');
  } else {
    $('pQueue').classList.add('hidden');
  }
}
function memberCard(m, isSpeakerPanel, iAmHost, myMicOn){
  const isMe = m.id === myId;
  const isHost = m.role === 'host';
  const cls = ['pav'];
  if (isHost) cls.push('host');
  else if (m.role === 'speaker') cls.push('speaker');
  if (isMe) cls.push('me');
  if (isMe && myMicOn) cls.push('live');
  if (isMe && (isHost || m.role === 'speaker')) cls.push('tapMe');
  if (iAmHost && !isMe && !(isHost && m.uid === room.hostUid)) cls.push('canManage');
  if (selectedMemberId === m.id && iAmHost) cls.push('selected');
  if (m.handRaised && !isSpeakerPanel) cls.push('hand');
  if (SPEAKING.has(m.id)) cls.push('speaking');

  const av = m.photo
    ? '<img src="' + esc(m.photo) + '" alt="">'
    : esc((m.name || '?').charAt(0).toUpperCase());
  const roleLbl = isHost ? (isMe ? 'You · Host' : 'Host')
    : m.role === 'speaker' ? (isMe ? 'You · Speaker' : 'Speaker')
    : (isMe ? 'You' : 'Listener');
  const roleCls = isHost ? ' host' : '';
  // Mic mute/unmute chip on EVERY speaker card. My own state comes from
   // wsVoice.micOn; remote members' state is derived from whether they've
   // published any tracks (their m.tracks length). If they published a
   // track and it's currently sending audio the tray also shows on.
   let micLive = false;
   if (isMe) micLive = !!myMicOn;
   else if (isSpeakerPanel) micLive = !!(m.tracks && m.tracks.length);
   const micChip = isSpeakerPanel ? `<span class="micchip ${micLive ? 'on' : ''}">${micLive ? '🎤' : '🔇'}</span>` : '';
  // Menu buttons MUST stopPropagation so they don't bubble to the .pav's
  // own onclick — which would re-toggle the selection and undo the action.
  // (Real bug that made "Approve" seem to do nothing sometimes.)
  const hostMenu = iAmHost && !isMe && !(isHost && m.uid === room.hostUid) ? `
    <div class="pav-menu">
      ${m.role === 'listener' ? `<button onclick="event.stopPropagation();promoteMember('${esc(m.id)}','speaker')">🎙 Make speaker</button>` : ''}
      ${m.role !== 'host'     ? `<button onclick="event.stopPropagation();promoteMember('${esc(m.id)}','host')">👑 Make co-host</button>` : ''}
      ${m.role !== 'listener' ? `<button onclick="event.stopPropagation();demoteMember('${esc(m.id)}')">↓ Move to listeners</button>` : ''}
      <button class="danger" onclick="event.stopPropagation();kickMember('${esc(m.id)}')">Remove from party</button>
    </div>` : '';

  const onclick = isMe && (isHost || m.role === 'speaker')
    ? 'onclick="toggleMyMic()"'
    : (iAmHost && !isMe && !(isHost && m.uid === room.hostUid))
    ? `onclick="event.stopPropagation();selectMember('${esc(m.id)}')"`
    : '';

  return `<div class="${cls.join(' ')}" data-id="${esc(m.id)}" ${onclick}>
    <div class="circ">${av}</div>
    ${micChip}
    <div class="nm">${esc(m.name)}</div>
    ${isSpeakerPanel ? `<div class="rl${roleCls}">${roleLbl}</div>` : ''}
    ${hostMenu}
  </div>`;
}

function selectMember(id){ selectedMemberId = selectedMemberId === id ? null : id; paint(); }
document.addEventListener('click', ev => {
  // Click outside an avatar tile clears the selection so the host menu
  // pops shut cleanly. IMPORTANT: the pav-menu is a CHILD of .pav so
  // .closest('.pav') covers menu clicks too — no separate check needed.
  // Before this comment the selector was fine but the menu buttons
  // themselves had an event.stopPropagation() dependency; keeping it
  // explicit here so a future edit doesn't remove the pav wrapper.
  if (!ev.target.closest('.pav')) { selectedMemberId = null; paint(); }
});

function paintQuota(){
  const q = $('pQuota');
  const inp = $('pInput');
  if (myRole === 'host' || myRole === 'speaker') {
    q.innerHTML = '<span class="pq-strong">Unlimited chat</span> · you\'re a speaker';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else if (msgsLeft > 0) {
    q.innerHTML = 'Listener chat · <span class="pq-strong">' + msgsLeft + ' message' + (msgsLeft === 1 ? '' : 's') + ' left</span>';
    inp.disabled = false;
    inp.placeholder = 'Say something…';
  } else {
    q.innerHTML = '<span class="pq-none">You\'ve used both your messages.</span> Tap ✋ to ask to speak — reactions still work.';
    inp.disabled = true;
    inp.placeholder = 'Chat limit reached';
  }
}
const _seenMsgs = new Set();
function addMsg(m){
  if (!m || !m.id) return;
  if (_seenMsgs.has(m.id)) return;       // de-dupe seed vs socket events
  _seenMsgs.add(m.id);
  const el = document.createElement('div');
  el.className = 'pmsg' + (m.f === myId ? ' mine' : '');
  el.dataset.id = m.id;
  const roleCls = m.r === 'host' ? ' host' : '';
  el.innerHTML = '<span class="pmwho' + roleCls + '">' + esc(m.n) + '</span>' + esc(m.x);
  $('pMsgs').appendChild(el);
  $('pMsgs').scrollTop = $('pMsgs').scrollHeight;
}

// Host actions
function promoteMember(id, role){ socket && socket.emit('promote', { id, role }); selectedMemberId = null; }
function demoteMember(id){ socket && socket.emit('demote', { id }); selectedMemberId = null; }
function kickMember(id){ if (confirm('Remove this person from the party?')) socket && socket.emit('kick', { id }); selectedMemberId = null; }
function denyHand(id){
  // Tell the server to clear their raised-hand flag; broadcast repaints
  // everyone. Local flag-toggle here is optimistic so the queue clears
  // instantly even before the state event round-trips.
  if (socket) socket.emit('denyHand', { id });
  const m = room.members.find(x => x.id === id); if (m) m.handRaised = false;
  paint();
}
function endParty(){ if (confirm('End the party for everyone?')) socket && socket.emit('closeParty'); }

function leaveAndGo(){
  try { socket && socket.emit('leave'); } catch(e){}
  clearPartySession();
  if (EMBED) { postToParent({ type: 'party:left' }); return; }
  location.href = '/social';
}

// Session bridge for the community app's mini-bar. Whenever we're in a
// party we write to localStorage; when the user opens /social they see
// a persistent "🎤 In party — tap to rejoin" bar. Cleared on leave/close.
function markPartySession(){
  try {
    localStorage.setItem('wsActiveParty', JSON.stringify({
      code: CODE,
      title: (room && room.title) || 'Party',
      role: myRole,
      at: Date.now()
    }));
  } catch(e){}
}
function clearPartySession(){ try { localStorage.removeItem('wsActiveParty'); } catch(e){} }

// beforeunload: warn if the user tries to close the tab / navigate away
// while in a party. Skipped when we're an embed — the parent /social
// document owns the unload dialog and we don't want two prompts.
window.addEventListener('beforeunload', (ev) => {
  if (EMBED) return;
  if (!socket || !myId) return;
  ev.preventDefault(); ev.returnValue = ''; return '';
});

let toastT = null;
function toast(msg){
  const el = $('pToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
<!-- No shared brand strip on the party page — owner: "remove the tab
     header". Audio rooms are their own immersive surface. -->
<script>document.documentElement.setAttribute('data-nochrome','1');</script>
</body>
