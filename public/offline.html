<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TalkSibi — Offline</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B6CFF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{--periwinkle:#5B6CFF;--ink:#14161F;--sub:#5A5F72;--line:#e6e7ee;--bg:#f7f8fb}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100dvh}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Hanken Grotesk','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
    text-align:center
  }
  .card{max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px 26px 30px;box-shadow:0 10px 40px rgba(20,22,31,.06)}
  .mark{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;background:linear-gradient(135deg,#5B6CFF,#7c8bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:32px;letter-spacing:-0.5px;box-shadow:0 6px 22px rgba(91,108,255,.35)}
  h1{margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-0.3px}
  p{margin:0 0 22px;font-size:15px;line-height:1.5;color:var(--sub)}
  button{
    background:var(--periwinkle);color:#fff;border:0;
    padding:12px 22px;border-radius:12px;font-family:inherit;font-weight:700;font-size:15px;
    cursor:pointer;transition:background .15s;min-width:160px
  }
  button:hover{background:#4353e8}
  button:active{transform:translateY(1px)}
  .foot{margin-top:22px;font-size:12.5px;color:var(--sub)}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">Ts</div>
    <h1>You're offline</h1>
    <p>TalkSibi needs an internet connection to chat, play, and translate with real people. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="foot">TalkSibi will reload automatically when you're back online.</div>
  </div>
<script>
  window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
